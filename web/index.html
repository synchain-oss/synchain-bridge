    <!-- [SL-386 / SL-433] 「首帧已绘」上行信号 —— 开窗遮挡闸唯一的正常放行路（3s 超时兜底除外）。
         机理/为什么挪窗/为什么只认首帧，只写在 src/WebViewRevealGate.h 一处，别在这里复述。
         通道：JUCE 内建 __JUCE__.postMessage ←→ withEventListener（不经 bridge.js、不占
         BridgeApi.h Fn:: 契约名表）；事件名真源 = src/BridgeApi.h timing::FirstFrameSignal，
         载荷里那个诊断字段名真源 = 同文件的 timing::FirstFramePaintDeltaKey，此处两者都逐字
         引用（判据 = web-preview/reveal-first-frame.test.mjs 第 ② 格）。
         [SL-433] 武装的触发条件是「**页面真的画过一帧**」（paint 记录到达），不是
         DOMContentLoaded：**嵌套两层 requestAnimationFrame 并不保证页面已经画过任何一帧**。
         按 DCL 触发时信号时刻 ≈ DCL + 两个 rAF，与 first-paint 之间没有任何约束 —— 信号早于
         first-paint 时，C++ 收到信号就把窗口揭开，而 Chromium widget 一个像素都还没画，
         露的是它自己的 base background（白）。这就是用户看到的「第二段白」。
         两层 rAF 仍然保留（paint 记录到达后再等一拍，让已画的那一帧提交给合成器）。
         回落路（没有 PerformanceObserver）与保险定时器各自的理由写在下面它们那里。
         浏览器预览下没有 __JUCE__，静默返回；发不出去也不许卡住 —— C++ 侧还有 3s 超时兜底。 -->
    <script>
      (function () {
        // [SL-433] paint 记录到达时把它的 startTime 记下来，信号发出时算差值。
        // −1 = 这一次没有 paint 记录（走了回落路或保险路）。
        var paintStartMs = -1;
        // [SL-433] `sent` 与「撤网」（clearTimeout）都落在 signal() 里，**不在 armOnce() 里**：
        // 网只在信号**真发出去**的那一刻才撤。若撤在 armOnce() 里，撤网之后剩下的就是 arm()
        // 那两层 rAF —— 而它恰恰是 BeginFrame 停摆那一档下不回调的东西（窗口被最小化 /
        // 被完全遮挡 / DAW 弹模态框把合成停了）⇒ 网没了、信号也发不出，仍旧掉进 C++ 的超时
        // 兜底。`sent` 兼做去重（保险与两层 rAF 都可能跑到这里）。
        //
        // ⚠ [SL-433 第 1 轮复审] 这两句必须排在 **postMessage 之后**，不是排在 `try` 之前。
        // 上一版排在 `try` 之前 ⇒ 排在了「`__JUCE__` 在不在」这道守卫之前：守卫命中而 return
        // （或 postMessage 抛异常被下面的 catch 吞掉）时，信号**一个字节都没发出去**，网却已经
        // 撤了 —— 与上面那句「网只在信号真发出去的那一刻才撤」**正好相反**，是一句实现给不到
        // 的保证。挪到这里之后：发不出去 ⇒ `sent` 仍为 false、网仍挂着 ⇒ 保险到点还会再试一次。
        // 不会死循环：能调到 signal() 的只有两层 rAF 那一条和保险那一条，各至多一次。
        // 判据 = 第 ② 格里「撤网与去重都必须排在 postMessage 之后」那两条。
        var sent = false;
        function signal() {
          if (sent) return;
          try {
            var juce = window.__JUCE__;
            if (!juce || typeof juce.postMessage !== "function") return;
            // [SL-433] 载荷里带上「信号时刻 − first-paint 时刻」这个**差值**。它只进 C++ 的
            // 诊断行，不参与任何放行判定。
            // ⚠ **送差值、不送 paint 的绝对时刻**：页面的 performance 时间轴与 C++ 的
            // mStartMs **不共享原点**，送绝对值过去无法与任何东西相减。
            // 没有 paint 记录时**不带这个字段**，C++ 那行会打 `(no paint record)`。
            // ⚠ 反过来读不成立：去重落在本函数里之后，保险的回调不再查 armed ⇒
            // 「paint 已到、两层 rAF 还没跑完就到 2.5s」这一路会**带着一个真实的差值**由保险
            // 发出。判「走没走保险路」要看诊断行 `after N ms` 的量级，不是看这个字段在不在。
            var p = {};
            if (paintStartMs >= 0)
              p.paintDeltaMs = Math.round(performance.now() - paintStartMs);
            juce.postMessage(
              JSON.stringify({ eventId: "__bridge__firstFrame", payload: p }),
            );
            // 走到这里信号才**真的发出去了** —— 去重与撤网都落在这一句之后（理由见上）。
            sent = true;
            if (guard !== null) {
              clearTimeout(guard);
              guard = null;
            }
          } catch {
            // 发不出去也不许卡住:C++ 侧还有 3s 超时兜底。
          }
        }
        function arm() {
          if (typeof window.requestAnimationFrame !== "function") {
            signal();
            return;
          }
          window.requestAnimationFrame(function () {
            window.requestAnimationFrame(signal);
          });
        }
        var armed = false;
        var guard = null;
        function armOnce() {
          if (armed) return;
          armed = true;
          arm();
        }
        // [SL-433] 保险定时器 —— paint 记录迟迟不来时的兜底。三件事都是有意为之：
        //   · **排在 try 之前**，不在 try 里面：排在 po.observe() 之后的话，
        //     `new PerformanceObserver` 抛错时这一行根本没执行过 ⇒ **回落路压根没有保险**；
        //   · 回调**直接 signal()，不绕 arm() 的两层 rAF**：「paint 不来」最可能的成因就是
        //     BeginFrame 停摆，那时 rAF 同样不回调 ⇒ 绕过去等于把绳子拴在同一根断掉的柱子上；
        //   · 撤网在 signal() 里（见上）。
        // ⚠ 它与 C++ 侧 3s 超时兜底**不共享时间原点**：后者从导航开始（pageAboutToLoad）起算，
        // 本行从**这段内联脚本执行**起算，中间隔着「导航开始 → 文档送达 → <head> 解析」，
        // 而那一段**读不出来**。所以别写「页内保险一定抢在 C++ 兜底前面」这种话 —— 冷起或
        // 机器吃紧时它跑输，放行原因照样掉成 timeout（形态是「多等一会儿占位」，不是崩）。
        // 另：页面在 hidden 状态下 Chromium 会把 setTimeout 节流到约 1 Hz，会进一步吃掉余量。
        guard = setTimeout(function () {
          signal();
        }, 2500);
        try {
          var po = new PerformanceObserver(function (list) {
            if (list.getEntries().length === 0) return;
            paintStartMs = list.getEntries()[0].startTime;
            try {
              po.disconnect();
            } catch {}
            armOnce();
          });
          // buffered:true —— paint 记录可能在本脚本跑之前就产生了，不 buffered 就永远收不到。
          po.observe({ type: "paint", buffered: true });
        } catch {
          // 没有 PerformanceObserver：回落 [SL-386] 的旧触发（DOMContentLoaded），不许变成
          // 永不放行。⚠ 这个 catch **只覆盖「压根没有 PerformanceObserver」**（以及只认
          // entryTypes 的史前实现）。「有 PerformanceObserver、但它不报 paint 记录」
          // **不会抛异常** —— 规范要求未知 type 直接 abort + 控制台 warning。那一档落在上面
          // 那条保险上：代价是「多等一会儿占位」，不是「永不放行」。
          if (document.readyState === "loading")
            document.addEventListener("DOMContentLoaded", armOnce);
          else armOnce();
        }
      })();
    </script>

      data-run="0"
      style="

        inset: 0;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--ff-sans);
        color: #2c2c2e;
        background: radial-gradient(
          circle at 50% 28%,
          #272430 0%,
          #18161d 70%,
          #131119 100%
        );
      "
    >

    <!-- ==================== APP LOGIC (bridge #1 wiring) ==================== -->
    <script type="module">
      import { createBridge, EVT } from "./bridge.js";
      import { dict, applyI18n } from "./i18n.js";

      const root = document.getElementById("vst-root");
      const card = root.querySelector("[data-card]");
      const q = (sel) => root.querySelector(sel);

      const els = {
        statusText: q("[data-status-text]"),
        clients: q("[data-clients]"),
        meterHost: q("[data-meter-host]"),
        sr: q("[data-sr]"),
        channels: q("[data-channels]"),
        latency: q("[data-latency]"),
        port: q("[data-port]"),
        vol: q("[data-vol]"),
        volLabel: q("[data-vol-label]"),
        cta: q("[data-cta]"),
        ctaText: q("[data-cta-text]"),
        hint: q("[data-hint]"),
        version: q("[data-version]"),
        scale: q("[data-scale]"),
        confirm: q("[data-confirm]"),
        confirmCountdown: q("[data-confirm-countdown]"),
        confirmKeep: q("[data-confirm-keep]"),
        confirmCancel: q("[data-confirm-cancel]"),
        langBtns: Array.from(root.querySelectorAll("[data-lang]")),
      };

      const state = {
        running: false,
        clients: 0,
        port: 9420,
        volume: 100,
        lang: "zh",
        channels: 2,
        uiScale: 1,
      };

      // 后端自动切换：插件内 -> JUCE 原生集成；纯浏览器 -> WsPreview(mock server)
      const bridge = createBridge({
        previewInit: {
          version: "1.3.1",
          port: state.port,
          volume: state.volume,
          lang: state.lang,
          uiScale: state.uiScale,
        },
      });
      const isPlugin = !bridge.isPreview;

      // ---------------- 界面缩放（DPI/窗口无关铺满 + 防呆确认）----------------
      // 插件内：C++ 把编辑器窗口 setSize 为 DESIGN×F；web 把卡片设为**固定设计盒 DESIGN_W×DESIGN_H px + zoom:F**
      // —— 渲染 = DESIGN×F = 编辑器窗口（setResizable(false,false) 保证），故精确铺满、内容恒按设计盒布局不裁切。
      // 卡片尺寸只用常量 F、**不读 innerWidth/CSS 视口** → 免疫 WebView2 resize 时视口不同步（v1.2.6 修右下黑边），
      // 也不复发 v1.2.4 高 DPI 双重放大。（v1.2.5 曾用 (100/F)% 视口百分比，已弃。）
      // 纯浏览器预览：卡片固定设计盒，按视口等比缩小以适配窄屏（叠加用户所选档位）。
      // DESIGN_W/H 必须与 C++ kDesignW/kDesignH 同步（见 WebViewEditor.cpp）。
      const DESIGN_W = 460;
      const DESIGN_H = 560;
      const SCALE_PRESETS = [0.33, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 2.5, 3];

      function applyPreviewFit() {
        // 预览：把 460×560 设计盒等比缩到浏览器视口内（窄/矮屏不裁切），再叠加用户所选档位。
        const fit = Math.min(
          1,
          (window.innerWidth - 24) / DESIGN_W,
          (window.innerHeight - 24) / DESIGN_H,
        );
        card.style.zoom = String(state.uiScale * Math.max(0.1, fit));
      }

      // 把当前 state.uiScale 应用到卡片（不改窗口、不弹确认）。
      function applyScale() {
        if (isPlugin) {
          // 卡片是固定设计盒（DESIGN_W×DESIGN_H，见 layoutForMode），仅用 zoom:F 缩放：渲染 = DESIGN×F =
          // 编辑器窗口（C++ setSize=DESIGN×F 保证）→ 精确铺满、内容恒按设计盒布局不裁切。**不读视口/innerWidth**
          // （v1.2.6：弃 (100/F)% 视口百分比——WebView2 原生 resize 时 CSS 视口不一定同步，会致右下黑边+裁切）。
          card.style.zoom = String(state.uiScale || 1);
        } else {
          applyPreviewFit();
        }
      }

      function layoutForMode() {
        if (isPlugin) {
          // #vst-root 已是 fixed;inset:0;overflow:hidden（= 视口裁剪框）；卡片 = 固定设计盒、绝对定位于左上，
          // 由 applyScale 的 zoom:F 缩放到铺满编辑器窗口（尺寸不依赖视口，稳健）。
          // [SL-386 第 2 推 R4 + 第 3 推 R1 时序改准] 插件路径关掉卡片入场动画 vbUp(0.6s 透明淡入)：
          // 占位对齐的是成品稳态，放行瞬间卡片不能还在淡入（浅占位→深 root→浅卡片的明暗跳变）。
          // 时序：主脚本 type="module"，boot() 在模块求值时（readyState === "interactive"）已执行、
          // 早于 DOMContentLoaded 派发。
          // ⚠ [SL-433] 首帧信号的触发条件已从 DOMContentLoaded 改成 **paint 记录到达**（见 <head>
          // 那段脚本），所以「先关动画、后发信号」**不再是构造保证**，按它现在的真实理由读：
          // first-paint 不可能早于渲染阻塞的 `<link rel="stylesheet">` 到达（styles.css 要经 JUCE
          // 资源提供器一次往返），而模块求值只要解析一结束就跑 —— 实际路径上 boot() 远在
          // first-paint 之前。真排到后面时最坏形态是放行瞬间卡片还在 0.6s vbUp 淡入的头几帧
          // （观感回归，不是功能缺陷）。浏览器预览路径（else 分支）动画照旧。
          Object.assign(root.style, {
            display: "block",
            alignItems: "",
            justifyContent: "",
          });
          Object.assign(card.style, {
            position: "absolute",
            top: "0",
            left: "0",
            width: DESIGN_W + "px",
            height: DESIGN_H + "px",
            maxWidth: "none",
            animation: "none",
          });
        } else {
          // 纯浏览器预览：卡片固定设计盒 + 按视口等比缩小演示（resize 重算 fit）。去掉 max-width:100%，
          // 窄屏由 applyPreviewFit 等比 zoom 兜住（否则宽度被裁会变形）。root 自身可滚动、卡片用 margin:auto
          // 居中——放大档位(>100%)超出视口时也能滚到被裁区域（规避 flex center 的溢出不可达），仅预览生效、不影响插件。
          Object.assign(root.style, {
            overflow: "auto",
            alignItems: "",
            justifyContent: "",
          });
          Object.assign(card.style, {
            width: DESIGN_W + "px",
            height: DESIGN_H + "px",
            maxWidth: "none",
            margin: "auto",
          });
          window.addEventListener("resize", applyPreviewFit);
        }
      }

      function nearestPreset(f) {
        let best = SCALE_PRESETS[0];
        let bd = Infinity;
        for (const p of SCALE_PRESETS) {
          const d = Math.abs(p - f);
          if (d < bd) {
            bd = d;
            best = p;
          }
        }
        return best;
      }

      // 静默设定档位（boot/snapshot 用已确认的持久值：不弹确认、插件内不再 setSize（C++ 构造已按持久值定尺寸））。
      function setScaleSilent(f) {
        state.uiScale = nearestPreset(Number(f) || 1);
        els.scale.value = String(state.uiScale);
        applyScale();
      }

      // ---- 防呆确认：切新档位后弹确认，10s 不点或点取消则回退上一个已确认档位（类 Windows 改分辨率）----
      const scaleConfirm = { prev: 1, timer: 0, countdown: 0 };
      const isConfirmPending = () => els.confirm.style.display === "flex";

      // 应用新档位到卡片 + 下拉 +（插件）C++ setSize/全局持久化。
      function applyScaleFull(f) {
        state.uiScale = nearestPreset(Number(f) || 1);
        els.scale.value = String(state.uiScale);
        applyScale();
        if (isPlugin) bridge.setUiScale(state.uiScale); // C++ setSize(DESIGN×F) 实时预览；全局落盘留到 keepScale
      }

      function requestScaleChange(f) {
        if (!isConfirmPending()) scaleConfirm.prev = state.uiScale; // 基线取上一个「已确认」档位
        applyScaleFull(f);
        showScaleConfirm();
      }

      function clearScaleConfirmTimers() {
        if (scaleConfirm.timer) clearTimeout(scaleConfirm.timer);
        if (scaleConfirm.countdown) clearInterval(scaleConfirm.countdown);
        scaleConfirm.timer = 0;
        scaleConfirm.countdown = 0;
      }

      function showScaleConfirm() {
        clearScaleConfirmTimers();
        let remaining = 10;
        els.confirmCountdown.textContent = String(remaining);
        els.confirm.style.display = "flex";
        scaleConfirm.countdown = setInterval(() => {
          remaining -= 1;
          els.confirmCountdown.textContent = String(Math.max(0, remaining));
        }, 1000);
        scaleConfirm.timer = setTimeout(revertScale, 10000);
      }

      function hideScaleConfirm() {
        clearScaleConfirmTimers();
        els.confirm.style.display = "none";
      }

      function keepScale() {
        hideScaleConfirm();
        // 确认后才把该档位写入全局默认（防呆：未确认档位不落盘，避免关窗污染新实例尺寸）。
        if (isPlugin) bridge.commitUiScale();
      }

      function revertScale() {
        const prev = scaleConfirm.prev;
        hideScaleConfirm();
        applyScaleFull(prev); // 回退到上一个已确认档位（同步改窗口 + 持久化）
      }

      // ---------------- 电平表：JS rAF 弹道（fast-follow + peak-hold），按声道数动态建条 ----------------
      // dBFS 刻度（镜像 lib/space/LevelMeter.tsx dbToPercent）：-60 地板 → 0%，0 顶 → 100%。
      const DB_FLOOR = -60;
      const DB_CEILING = 0;
      const DB_RANGE = DB_CEILING - DB_FLOOR;
      // 弹道常量（镜像 lib/space/peak-hold.ts 与 lib/hooks/useTrackAudioLevel.ts）。
      const PEAK_HOLD_MS = 2200;
      const PEAK_DECAY_DB_PER_SEC = 20;
      const LEVEL_DECAY_DB_PER_SEC = 120;
      const METER_GRADIENT =
        "linear-gradient(90deg,#76C28C 0%,#76C28C 52%,#D6C078 78%,#D98C8C 100%)";

      function dbToPercent(db) {
        if (!Number.isFinite(db) || db <= DB_FLOOR) return 0;
        return ((Math.min(db, DB_CEILING) - DB_FLOOR) / DB_RANGE) * 100;
      }

      // 峰值保持弹道：瞬时起振 → 平台保持 → 线性衰减，恒保证 peak >= level。
      function stepPeakHold(st, level, dtSec, now) {
        if (!Number.isFinite(st.peak) || level >= st.peak)
          return { peak: level, holdUntil: now + PEAK_HOLD_MS };
        if (now < st.holdUntil) return st;
        return {
          peak: Math.max(
            level,
            st.peak - PEAK_DECAY_DB_PER_SEC * Math.max(0, dtSec),
          ),
          holdUntil: st.holdUntil,
        };
      }

      const meter = {
        count: 0,
        targetDb: [],
        fastDb: [],
        peakState: [],
        fillEls: [],
        gradEls: [],
        peakEls: [],
        dbEls: [],
        lastTick: 0,
        raf: 0,
      };

      function buildMeters(nRaw) {
        const n = Math.max(1, Math.min(2, nRaw | 0));
        if (n === meter.count && meter.fillEls.length === n) return;
        meter.count = n;
        meter.targetDb = [];
        meter.fastDb = [];
        meter.peakState = [];
        meter.fillEls = [];
        meter.gradEls = [];
        meter.peakEls = [];
        meter.dbEls = [];
        els.meterHost.textContent = "";
        const labels = n === 1 ? [""] : ["L", "R"];
        for (let i = 0; i < n; i++) {
          const row = document.createElement("div");
          row.style.cssText =
            "display:flex;align-items:center;gap:9px" +
            (i < n - 1 ? ";margin-bottom:9px" : "");

          const lab = document.createElement("span");
          lab.textContent = labels[i];
          lab.style.cssText =
            "font-family:var(--ff-mono);font-size:9px;color:#6A6A74;width:10px";

          const track = document.createElement("div");
          track.style.cssText =
            "flex:1;height:9px;border-radius:999px;background:rgba(255,255,255,0.3);overflow:hidden;position:relative;border:1px solid rgba(255,255,255,0.42)";

          const fill = document.createElement("div");
          fill.style.cssText =
            "position:absolute;left:0;top:0;height:100%;width:0%;border-radius:999px;overflow:hidden";
          const grad = document.createElement("div");
          // 内层渐变按「轨道整宽」放大，使颜色随绝对位置稳定（不随填充宽度伸缩），与 Creative Space 一致。
          grad.style.cssText =
            "position:absolute;left:0;top:0;height:100%;width:0%;background:" +
            METER_GRADIENT;
          fill.appendChild(grad);

          const peak = document.createElement("div");
          peak.style.cssText =
            "position:absolute;top:0;left:0;height:100%;width:2px;border-radius:999px;background:rgba(255,255,255,0.8);opacity:0";

          track.appendChild(fill);
          track.appendChild(peak);

          const db = document.createElement("span");
          db.textContent = "—";
          // tabular/lining 数字：dB 读数跳动时列宽稳定（对齐 styles.css 既有实时数值样式意图）。
          db.style.cssText =
            "font-family:var(--ff-mono);font-size:8.5px;color:#6A6A74;width:32px;text-align:right;font-variant-numeric:tabular-nums lining-nums";

          row.appendChild(lab);
          row.appendChild(track);
          row.appendChild(db);
          els.meterHost.appendChild(row);

          meter.targetDb.push(-Infinity);
          meter.fastDb.push(-Infinity);
          meter.peakState.push({ peak: -Infinity, holdUntil: 0 });
          meter.fillEls.push(fill);
          meter.gradEls.push(grad);
          meter.peakEls.push(peak);
          meter.dbEls.push(db);
        }
      }

      function resetMeters() {
        for (let i = 0; i < meter.count; i++) {
          meter.targetDb[i] = -Infinity;
          meter.fastDb[i] = -Infinity;
          meter.peakState[i] = { peak: -Infinity, holdUntil: 0 };
        }
      }

      function meterTick(now) {
        const dt = Math.max(0, (now - meter.lastTick) / 1000);
        meter.lastTick = now;
        for (let i = 0; i < meter.count; i++) {
          const target = state.running ? meter.targetDb[i] : -Infinity;
          // 绿条：瞬时起振、快回落 120 dB/s（近乎实时跟音）。
          let fast = meter.fastDb[i];
          if (target >= fast || !Number.isFinite(fast)) fast = target;
          else fast = Math.max(target, fast - LEVEL_DECAY_DB_PER_SEC * dt);
          meter.fastDb[i] = fast;
          // 峰值线：hold-then-decay。
          meter.peakState[i] = stepPeakHold(
            meter.peakState[i],
            target,
            dt,
            now,
          );

          const pct = dbToPercent(fast);
          if (pct > 0) {
            meter.fillEls[i].style.width = pct.toFixed(2) + "%";
            meter.gradEls[i].style.width = (10000 / pct).toFixed(1) + "%";
          } else {
            meter.fillEls[i].style.width = "0%";
          }

          const pkDb = meter.peakState[i].peak;
          const pkPct = dbToPercent(pkDb);
          if (state.running && Number.isFinite(pkDb) && pkPct > 0) {
            meter.peakEls[i].style.left =
              Math.min(pkPct, 99.5).toFixed(2) + "%";
            meter.peakEls[i].style.opacity = "1";
          } else {
            meter.peakEls[i].style.opacity = "0";
          }

          const readDb = state.running ? meter.targetDb[i] : -Infinity;
          meter.dbEls[i].textContent =
            Number.isFinite(readDb) && readDb > DB_FLOOR
              ? readDb.toFixed(1)
              : "—";
        }
        meter.raf = requestAnimationFrame(meterTick);
      }

      // ---------------- helpers ----------------
      const t = () => dict(state.lang);

      // 连接状态（状态灯据此显示）：offline=桥未启动；waiting=已启动但无浏览器客户端连接（桥断/浏览器关，
      // 用户能借此察觉「链路断了」）；online=有浏览器客户端在桥。CTA/图标仍按 running（见 data-run）。
      const connState = () =>
        !state.running ? "offline" : state.clients > 0 ? "online" : "waiting";
      const renderStatusText = () => {
        root.dataset.conn = connState(); // 供 CSS 上色（绿=online / 琥珀=waiting / 灰=offline）
        els.statusText.textContent = t()[connState()]; // online / waiting / offline 文案
      };
      const renderChannels = () => {
        els.channels.textContent = state.channels === 1 ? t().mono : t().stereo;
      };
      const renderCta = () => {
        els.ctaText.textContent = state.running ? t().stop : t().start;
      };
      const renderHint = () => {
        const c = connState();
        els.hint.textContent =
          c === "online"
            ? t().startedHint
            : c === "waiting"
              ? t().waitingHint
              : t().stoppedHint;
      };
      const renderClients = () => {
        els.clients.textContent = state.running ? String(state.clients) : "0";
      };

      function updateLangButtons() {
        els.langBtns.forEach((b) => {
          const active = b.getAttribute("data-lang") === state.lang;
          b.style.background = active
            ? "rgba(255,255,255,0.92)"
            : "transparent";
          b.style.color = active ? "#21212A" : "#62626C";
          b.setAttribute("aria-pressed", active ? "true" : "false");
        });
      }

      function renderAll() {
        const tt = applyI18n(root, state.lang); // 静态 [data-t] 标签
        document.documentElement.lang = state.lang; // a11y：同步文档语言
        els.port.setAttribute("aria-label", tt.localPort); // 控件无障碍名称随语言走
        els.vol.setAttribute("aria-label", tt.master + " (0-200%)");
        els.scale.setAttribute("aria-label", tt.scale);
        renderStatusText();
        renderChannels();
        renderCta();
        renderHint();
        renderClients();
        updateLangButtons();
      }

      function setRunning(running) {
        state.running = running;
        root.dataset.run = running ? "1" : "0";
        renderStatusText();
        renderCta();
        renderHint();
        renderClients();
        if (!running) resetMeters(); // 停止：弹道复位归零（根治空闲假电平）
      }

      function showTransientHint(text) {
        els.hint.textContent = text;
        setTimeout(renderHint, 3200);
      }

      // ---------------- C++/mock -> UI ----------------
      bridge.on(EVT.STATE, (s) => {
        if (!s) return;
        if (typeof s.clients === "number") state.clients = s.clients;
        if (typeof s.port === "number" && s.port > 0) {
          state.port = s.port;
          if (document.activeElement !== els.port)
            els.port.value = String(s.port);
        }
        if (typeof s.running === "boolean") setRunning(s.running);
        // running 未变但客户端数变（浏览器连上/断开）：刷新连接状态灯 + 提示 + 客户端数。
        else {
          renderStatusText();
          renderHint();
          renderClients();
        }
      });

      bridge.on(EVT.METER, (m) => {
        if (!m) return;
        // 只喂 dBFS 目标值给弹道（渲染在 meterTick）：单声道用 ldb，立体声用 ldb/rdb。
        if (meter.count >= 1)
          meter.targetDb[0] = Number.isFinite(m.ldb) ? m.ldb : -Infinity;
        if (meter.count >= 2)
          meter.targetDb[1] = Number.isFinite(m.rdb) ? m.rdb : -Infinity;
      });

      bridge.on(EVT.AUDIO, (a) => {
        if (!a) return;
        if (typeof a.sampleRate === "number" && a.sampleRate > 0)
          els.sr.textContent = (a.sampleRate / 1000).toFixed(1);
        if (typeof a.channels === "number") {
          state.channels = a.channels;
          renderChannels();
          buildMeters(a.channels);
        }
        if (a.latencyMs != null && Number.isFinite(Number(a.latencyMs)))
          els.latency.textContent = Number(a.latencyMs).toFixed(1);
      });

      bridge.on(EVT.ERROR, (e) => {
        if (!e) return;
        showTransientHint(e.message || e.code || "Error");
      });

      // ---------------- UI -> C++/mock ----------------
      els.langBtns.forEach((b) => {
        b.addEventListener("click", () => {
          const code = b.getAttribute("data-lang");
          if (code === state.lang) return;
          state.lang = code;
          bridge.setLang(code);
          renderAll();
        });
      });

      els.port.addEventListener("input", () => {
        els.port.value = (els.port.value || "")
          .replace(/[^0-9]/g, "")
          .slice(0, 5);
      });
      els.port.addEventListener("change", () => {
        const p = parseInt(els.port.value, 10);
        if (p >= 1024 && p <= 65535) {
          state.port = p;
          bridge.setPort(p);
        }
      });

      els.vol.addEventListener("input", () => {
        const pct = parseInt(els.vol.value, 10) || 0;
        state.volume = pct;
        els.volLabel.textContent = pct + "%";
        bridge.setMasterGain(pct);
      });

      els.scale.addEventListener("change", () => {
        requestScaleChange(parseFloat(els.scale.value) || 1); // 改档位 -> 应用 + 弹防呆确认（10s 自动恢复）
      });
      els.confirmKeep.addEventListener("click", keepScale);
      els.confirmCancel.addEventListener("click", revertScale);

      els.cta.addEventListener("click", async () => {
        const want = !state.running;
        if (want) {
          const p = parseInt(els.port.value, 10);
          if (p >= 1024 && p <= 65535) {
            state.port = p;
            await bridge.setPort(p);
          }
        }
        const r = (await bridge.toggleRun(want)) || {};
        if (r.error) showTransientHint(r.error);
        if (typeof r.port === "number" && r.port > 0) {
          state.port = r.port;
          if (document.activeElement !== els.port)
            els.port.value = String(r.port);
        }
        setRunning(typeof r.running === "boolean" ? r.running : want);
      });

      // ---------------- cursor-follow glow (single document handler) ----------------
      let glowEl = null;
      document.addEventListener("mousemove", (e) => {
        const el =
          (e.target.closest && e.target.closest("[data-glow], button")) || null;
        if (el !== glowEl) {
          if (glowEl) glowEl.style.setProperty("--glow", "0");
          glowEl = el;
          if (el) el.style.setProperty("--glow", "1");
        }
        if (el) {
          const rect = el.getBoundingClientRect();
          el.style.setProperty("--mx", e.clientX - rect.left + "px");
          el.style.setProperty("--my", e.clientY - rect.top + "px");
        }
      });

      // ---------------- first paint: seed labels, then pull race-free snapshot ----------------
      function applySnapshot(s) {
        if (!s) return;
        if (s.version) els.version.textContent = "Synchain VST · v" + s.version;
        if (s.lang) state.lang = s.lang;
        if (typeof s.volume === "number") {
          state.volume = s.volume;
          els.vol.value = String(s.volume);
          els.volLabel.textContent = s.volume + "%";
        }
        if (typeof s.port === "number" && s.port > 0) {
          state.port = s.port;
          els.port.value = String(s.port);
        }
        if (typeof s.sampleRate === "number" && s.sampleRate > 0)
          els.sr.textContent = (s.sampleRate / 1000).toFixed(1);
        if (typeof s.channels === "number") {
          state.channels = s.channels;
          buildMeters(s.channels);
        }
        if (s.latencyMs != null && Number.isFinite(Number(s.latencyMs)))
          els.latency.textContent = Number(s.latencyMs).toFixed(1);
        if (typeof s.clients === "number") state.clients = s.clients;
        if (s.uiScale != null) setScaleSilent(s.uiScale); // 静默应用持久档位（不弹确认、不改窗口）
        renderAll();
        setRunning(!!s.running);
      }

      async function boot() {
        layoutForMode();
        setScaleSilent(state.uiScale);
        buildMeters(state.channels);
        meter.lastTick = performance.now();
        meter.raf = requestAnimationFrame(meterTick);
        renderAll(); // 立即按默认语言渲染静态标签
        try {
          applySnapshot(await bridge.requestInitialState());
        } catch {
          renderAll(); // 兜底
        }
      }

      if (document.readyState === "loading") {
        window.addEventListener("DOMContentLoaded", boot);
      } else {
        boot();
      }
    </script>
  </body>
</html>
