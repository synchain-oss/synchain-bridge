# release.yml —— tag v* 触发草稿 Release(08 §5.2 / 06 §3.8 / 06 §4.1 Bridge 侧)
# 不设 workflow_dispatch:B08 验收要验证的正是 push: tags: ['v*'] 这个触发器本身,
# 用 workflow_dispatch 替代实测会被判不合格(07 §B08)。tag 格式 vX.Y.Z(08 §3.4,去 vst- 前缀)。
#
# 四段式:gate(版本门禁)→ release / release-macos(两平台并行构建+打包)→ publish(建 draft Release)。
# 版本门禁独立成 job 并前置:两个平台的构建都在门禁绿了之后才起,tag 打错时不浪费 windows/macOS 分钟数。
name: Release

on:
  push:
    tags: ['v*']

# contents: write 只授给 publish 一个 job —— 它是唯一需要写 Release 的地方。
# workflow 级降为只读:构建 job 跑的是第三方代码(JUCE / vcpkg / pluginval),
# 拿不到写权限,爆炸半径从整个 workflow 收敛到最后一步(06 §3.8)。
# 第三方 action 一律 pin 到 40 位 commit SHA(06 §8.4 铁律),注释写版本号便于 dependabot。
# 绝不使用 pull_request_target(J20 禁令,全域有效)。
permissions:
  contents: read

jobs:
  # ============================================================================
  # gate —— 版本一致性门禁(平台无关,放最便宜的 runner 上)
  # ============================================================================
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ---- 版本一致性门禁(06 §3.8 / 08 §5.2):tag 与 CMake VERSION 不一致时 job 必须 fail ----
      # 逻辑与拆 job 前逐字相同,只是多导出一个 outputs.version 给下游两个构建 job 用;
      # pwsh 在 ubuntu-latest 上预装,不需要额外安装步骤。
      # tag 名经 step env 间接读入,不直接插值进脚本:tag 允许 '$'、反引号、'"',
      # 直插 pwsh 可闭合引号执行任意命令(与 ci.yml 对 ref_name 的加固同口径)。
      # 只有有 push 权限者能打 tag,但这正是 ci.yml 里已被判为注入面的同一类风险,不能只加固一处。
      - name: Verify tag matches CMake VERSION
        id: version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag  = $env:REF_NAME
          # tag 形态断言(CLAUDE.md §9 的 vX.Y.Z,可带 SemVer 预发布后缀如 -test)。
          # env 间接读入已经堵死了「tag 被当代码求值」,这一条再把奇怪字符挡在链路入口外:
          # 这个值会流进 outputs.version → 两个平台的打包脚本 → zip / .sha256 / INSTALL.txt 的文件名与正文,
          # 与其让 'v1.5.0$(...)' 变成一个畸形资产名,不如在 gate 就红。
          # -c* = 大小写敏感:pwsh 默认不敏感,'V1.5.0' 会静默走通并让 INSTALL.txt 里的
          # 源码 URL(tree/v1.5.0)404 —— GPLv3 对应源声明正靠该链接兑现(采纳 #21 review)。
          if ($tag -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            Write-Error "tag '$tag' is not vX.Y.Z[-prerelease]"; exit 1
          }
          $want = $tag -creplace '^v',''
          $line = Select-String -Path CMakeLists.txt -Pattern 'project\s*\(\s*\S+\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)'
          if (-not $line) { Write-Error "cannot parse VERSION from CMakeLists.txt"; exit 1 }
          $cmake = $line.Matches[0].Groups[1].Value
          if ($want -cmatch '-test$') {
            # 冒烟测试 tag(v0.0.0-test):非真实发布,仅端到端验证触发+构建+打包+Release 全链路,
            # 跳过严格版本相等(其版本号有意不同于 CMake VERSION);产物恒为 draft,验完即删。
            Write-Host "::warning::test tag '$tag' bypasses strict version gate (draft-only smoke test)"
          } else {
            $core = if ($want -match '^([0-9]+\.[0-9]+\.[0-9]+)') { $Matches[1] } else { $want }
            if ($core -ne $cmake) {
              Write-Error "tag=$tag (version core=$core) != CMake VERSION=$cmake"
              exit 1
            }
            Write-Host "version gate OK: tag '$tag' == CMake VERSION '$cmake'"
          }
          "version=$want" | Out-File $env:GITHUB_OUTPUT -Append

  # ============================================================================
  # release —— Windows x64(VST3)
  # ============================================================================
  release:
    name: release
    runs-on: windows-2022
    needs: gate
    timeout-minutes: 60
    env:
      WEBVIEW2_NUGET_VERSION: '1.0.2957.106'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ---- 以下构建步骤与 ci.yml 同构(读 .juce-version / .pluginval-version,去 vst-plugin/ 前缀)----
      - name: Resolve pinned versions
        shell: pwsh
        run: |
          $juce = (Get-Content .juce-version -Raw).Trim()
          $pv   = (Get-Content .pluginval-version -Raw).Trim()
          if (-not $juce -or -not $pv) { Write-Error "empty .juce-version / .pluginval-version"; exit 1 }
          "JUCE_TAG=$juce"    | Out-File $env:GITHUB_ENV -Append
          "PLUGINVAL_TAG=$pv" | Out-File $env:GITHUB_ENV -Append

      # JUCE / vcpkg 缓存与 ci.yml 的 windows job 同 key(juce-<os>-<.juce-version 哈希> /
      # vcpkg-bincache-<os>-<ImageOS-ImageVersion>-<triplet>-<vcpkg.json 哈希>):发版 tag 与 dev 同一份 .juce-version /
      # vcpkg.json、同一代 runner 镜像时直接复用 CI 攒下的缓存;同镜像下 vcpkg.json 改动经 restore-keys 回落一级
      # (不跨镜像回落:ABI 哈希必然全变,只会撑大条目);miss 亦照常 clone / 编译。
      # JUCE 身份断言与 ci.yml 逐字相同:HEAD 上的 tag(git tag --points-at HEAD)必须含 JUCE_TAG,缓存对不上先重 clone 再红。
      - name: Cache JUCE
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/JUCE
          key: juce-${{ runner.os }}-${{ hashFiles('.juce-version') }}

      - name: Clone JUCE (shallow, pinned; skipped on cache hit) & assert tag identity
        shell: pwsh
        run: |
          $juce = "${{ github.workspace }}/JUCE"
          $want = $env:JUCE_TAG -replace '^v', ''
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            $cloned = $false
            if (Test-Path (Join-Path $juce 'CMakeLists.txt')) {
              Write-Host "JUCE $env:JUCE_TAG restored from cache (attempt $attempt)"
            } else {
              if (Test-Path $juce) { Remove-Item $juce -Recurse -Force }
              git clone --depth 1 --branch $env:JUCE_TAG https://github.com/juce-framework/JUCE.git $juce
              if ($LASTEXITCODE -ne 0) { Write-Error "git clone JUCE $env:JUCE_TAG failed"; exit 1 }
              $cloned = $true
            }
            # `git tag --points-at HEAD` 列出 HEAD 上的全部 tag 再找 JUCE_TAG,而不是 `describe --exact-match`:后者一个 commit
            # 挂多个 tag 时只回其中一个,会把正确的缓存误判成污染。不接 `| Select-Object -First 1` 在 git 后面:它会提前掐断
            # 管道,git 的退出码来不及写进 $LASTEXITCODE(实测为空),断言会随机翻车。
            # try/catch:缓存目录在但 .git 缺失/损坏时 git 退出 128,pwsh 7.4+ 默认 $PSNativeCommandUseErrorActionPreference
            # 会把原生命令非零退出抛成终止性错误,下一行的 $LASTEXITCODE 判断轮不到执行 —— 包住才能走到「删掉重 clone」。
            try { $tags = @(git -C $juce tag --points-at HEAD 2>$null) } catch { $tags = @() }
            if ($LASTEXITCODE -ne 0) { $tags = @() }
            $tags = @($tags | ForEach-Object { ([string]$_).Trim() } | Where-Object { $_ })
            $got = ($tags | Where-Object { ($_ -replace '^v', '') -eq $want } | Select-Object -First 1)
            if ($got) { Write-Host "JUCE identity OK: HEAD is tag '$got' == .juce-version $env:JUCE_TAG"; exit 0 }
            if ($cloned) { Write-Error "freshly cloned JUCE HEAD carries tags [$($tags -join ', ')], expected $env:JUCE_TAG"; exit 1 }
            Write-Host "::warning::cached JUCE HEAD carries tags [$($tags -join ', ')], expected $env:JUCE_TAG; discarding cache entry and re-cloning"
            Remove-Item $juce -Recurse -Force
          }
          Write-Error "JUCE identity check failed: expected $env:JUCE_TAG"; exit 1

      # vcpkg manifest 模式(与 ci.yml 同构,细节注释见那里):版本由仓库根 vcpkg.json 的 builtin-baseline + overrides 钉死;
      # 不显式 `vcpkg install`,依赖由 Configure 步骤的 vcpkg toolchain 按 vcpkg.json 装进 build/vcpkg_installed。
      # triplet 只由 Configure 的 -DVCPKG_TARGET_TRIPLET 决定,不设 VCPKG_DEFAULT_TRIPLET(manifest 模式下是死配置)。
      - name: Setup vcpkg (manifest mode + binary cache dir)
        shell: pwsh
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          $bc = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Force -Path $bc | Out-Null
          echo "VCPKG_DEFAULT_BINARY_CACHE=$bc" >> $env:GITHUB_ENV
          $img = if ($env:ImageOS -and $env:ImageVersion) { "$env:ImageOS-$env:ImageVersion" } else { 'unknown-image' }
          Write-Host "runner image for vcpkg cache key: $img"
          echo "VCPKG_CACHE_IMAGE=$img" >> $env:GITHUB_ENV
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" --version

      - name: Cache vcpkg binary cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-bincache-${{ runner.os }}-${{ env.VCPKG_CACHE_IMAGE }}-x64-windows-static-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-bincache-${{ runner.os }}-${{ env.VCPKG_CACHE_IMAGE }}-x64-windows-static-

      - name: Ensure WebView2 Runtime (Evergreen)
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\MicrosoftEdgeWebView2Setup.exe"
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $exe
          Start-Process -FilePath $exe -ArgumentList "/silent","/install" -Wait
          echo "WEBVIEW2_USER_DATA_FOLDER=$env:RUNNER_TEMP\wv2ud" >> $env:GITHUB_ENV

      - name: Cache WebView2 NuGet package
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/packages
          key: webview2-nuget-${{ env.WEBVIEW2_NUGET_VERSION }}

      # Configure 里 vcpkg toolchain 按 vcpkg.json 自动装 ixwebsocket;随后断言装进来的版本 == vcpkg.json overrides
      # (version-semver + port-version,且 Status 为 install ok installed)、传递依赖 mbedtls / zlib == THIRD-PARTY-NOTICES.md
      # 登记的版本 —— 发版链路更不能静默带一个漂了的依赖出去。断言逻辑在 scripts/assert-vcpkg-installed.ps1,
      # 与 ci.yml 及本地 scripts/gates.ps1 共用同一份。
      - name: Configure CMake
        shell: pwsh
        run: |
          if (Test-Path build) { Get-ChildItem build -Exclude packages | Remove-Item -Recurse -Force }
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DJUCE_PATH="${{ github.workspace }}/JUCE" -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static
          if ($LASTEXITCODE -ne 0) { Write-Error "cmake configure failed"; exit 1 }
          ./scripts/assert-vcpkg-installed.ps1 -BuildDir build
          if ($LASTEXITCODE -ne 0) { Write-Error "vcpkg_installed does not match the pinned versions (see ::error:: lines above)"; exit 1 }

      # 排除项含 vcpkg_installed:manifest 模式下第三方头落在 build/vcpkg_installed/...,路径里不再有 `\vcpkg\`
      - name: Build (fail on any MSVC warning)
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { Write-Error "build failed"; exit 1 }
          $w = Select-String -Path build.log -Pattern '\swarning\s+C\d{4}' | Where-Object { $_.Line -notmatch '[\\/](JUCE|vcpkg|vcpkg_installed|_deps)[\\/]' }
          if ($w.Count -gt 0) {
            $w | ForEach-Object { Write-Host "::error::$($_.Line)" }
            Write-Error "MSVC warnings: $($w.Count); /W4 requires zero warnings"; exit 1
          }

      - name: Download pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/Tracktion/pluginval/releases/download/$env:PLUGINVAL_TAG/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval

      - name: Validate VST3
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path build -Recurse -Filter "*.vst3" -Directory | Select-Object -First 1
          if (-not $vst3) { Write-Error "No VST3 bundle found under build"; exit 1 }
          Write-Host "::group::pluginval $($vst3.Name)"
          & ./pluginval/pluginval.exe --strictness-level 5 --timeout-ms 60000 --skip-gui-tests --output-dir "$env:RUNNER_TEMP/pluginval-logs" "$($vst3.FullName)" 2>&1 | Out-Host
          $code = $LASTEXITCODE
          Write-Host "::endgroup::"
          if ($code -ne 0) { Write-Error "pluginval failed for $($vst3.Name) (exit $code)"; exit 1 }
          Write-Host "Non-GUI strictness-5 passed; full GUI validation is a LOCAL gate."

      # ---- 打包:唯一真源 = scripts/package.ps1(06 §3.8 / 08 §5.2);绝不在 YAML 内联 7z 通配 ----
      # 版本号取 gate 算好的 outputs.version(已去 v 前缀),两平台同一个值;
      # 经 step env 间接读入而不是直插 pwsh —— tag 允许 '$'、反引号、'"'。
      # gate 没写出 output 时(步骤改名 / Out-File 失败 / 将来有人加 continue-on-error)
      # 这里直接 fail,不让打包脚本静默回落到 CMake 版本、产出版本号对不上的 zip。
      - name: Package
        shell: pwsh
        env:
          PKG_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PKG_VERSION)) {
            Write-Error "::error::gate did not export version"; exit 1
          }
          ./scripts/package.ps1 -Version $env:PKG_VERSION -BuildDir build -OutDir dist

      - name: Publish job summary
        shell: pwsh
        run: Get-Content dist/package-summary.md | Out-File $env:GITHUB_STEP_SUMMARY -Append

      # ---- 产物交给 publish job 统一挂到 Release 上:本 job 只读权限,写 Release 的只有 publish ----
      - name: Upload dist (win64)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-win64
          path: |
            dist/SynchainBridge-VST3-*-win64.zip
            dist/SynchainBridge-VST3-*-win64.zip.sha256
            dist/package-summary.md
          if-no-files-found: error
          retention-days: 7

  # ============================================================================
  # release-macos —— macOS(Apple Silicon):VST3 + AU,arm64-only,不签名不公证(U13)
  # 与 ci.yml 的 build-and-validate-macos 同构,末尾多一步 scripts/package-macos.sh。
  #
  # ⚠️ 已知权衡(见 docs/release.md §6):publish `needs: [release, release-macos]`,
  #    本 job 挂掉 = 整个 tag 一个产物都发不出去(包括已构建成功的 Windows zip)。
  #    timeout 与 windows job 对齐到 60 分钟 —— 两边都要编译两个 format wrapper,mac 侧还多一次
  #    ixwebsocket 的编译,30 分钟偏紧(JUCE / ixwebsocket 源码有缓存,但 miss 也得够用)。
  # ============================================================================
  release-macos:
    name: release-macos
    runs-on: macos-15                   # arm64 原生;macos-14 已进弃用窗口
    needs: gate
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve pinned versions
        shell: bash
        run: |
          set -euo pipefail
          juce=$(tr -d '[:space:]' < .juce-version)
          pv=$(tr -d '[:space:]' < .pluginval-version)
          if [ -z "$juce" ] || [ -z "$pv" ]; then
            echo "::error::empty .juce-version / .pluginval-version"; exit 1
          fi
          echo "JUCE_TAG=$juce"    >> "$GITHUB_ENV"
          echo "PLUGINVAL_TAG=$pv" >> "$GITHUB_ENV"
          # ixwebsocket 的 pin 与仓库 URL 从单一真源 CMakeLists.txt 现读(与 ci.yml 的 mac job 逐字相同):
          # GIT_REPOSITORY 绑定到 ixwebsocket 的 FetchContent_Declare 段内取,不会误拿别的 FetchContent 依赖的 URL
          ix_sha=$(sed -nE 's/^[[:space:]]*set\(IXWEBSOCKET_TAG[[:space:]]+"([0-9a-f]{40})".*/\1/p' CMakeLists.txt | head -n 1)
          ix_url=$(awk '/FetchContent_Declare\(ixwebsocket/ { f = 1 } f && $1 == "GIT_REPOSITORY" { print $2; exit }' CMakeLists.txt)
          if [ -z "$ix_sha" ] || [ -z "$ix_url" ]; then
            echo "::error::cannot parse IXWEBSOCKET_TAG (40-hex) / GIT_REPOSITORY from CMakeLists.txt"; exit 1
          fi
          echo "IXWEBSOCKET_SHA=$ix_sha" >> "$GITHUB_ENV"
          echo "IXWEBSOCKET_URL=$ix_url" >> "$GITHUB_ENV"

      # 工具链留痕:runner 镜像每月轮换,出问题时这段日志用于区分「代码回归 or 镜像漂移」
      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          cmake --version
          clang --version
          xcodebuild -version

      # JUCE / ixwebsocket 源码缓存与 ci.yml 的 mac job 同 key、同判定(细节注释见那里):miss 照常 clone;
      # JUCE 身份断言(HEAD 上的 tag 须含 JUCE_TAG,缓存对不上先重 clone 再红)与 ci.yml 逐字相同。
      - name: Cache JUCE
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/JUCE
          key: juce-${{ runner.os }}-${{ hashFiles('.juce-version') }}

      - name: Clone JUCE (shallow, pinned; skipped on cache hit) & assert tag identity
        shell: bash
        run: |
          set -euo pipefail
          juce="${{ github.workspace }}/JUCE"
          want="${JUCE_TAG#v}"
          for attempt in 1 2; do
            cloned=0
            if [ -f "$juce/CMakeLists.txt" ]; then
              echo "JUCE $JUCE_TAG restored from cache (attempt $attempt)"
            else
              rm -rf "$juce"
              git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git "$juce"
              cloned=1
            fi
            # `git tag --points-at HEAD` 列出 HEAD 上的全部 tag 再找 JUCE_TAG(与 pwsh 版同口径;`describe --exact-match`
            # 在一个 commit 挂多个 tag 时只回其中一个,会把正确的缓存误判成污染)
            tags="$(git -C "$juce" tag --points-at HEAD 2>/dev/null || true)"
            got=""
            while IFS= read -r t; do
              if [ -n "$t" ] && [ "${t#v}" = "$want" ]; then got="$t"; break; fi
            done <<< "$tags"
            if [ -n "$got" ]; then
              echo "JUCE identity OK: HEAD is tag '$got' == .juce-version $JUCE_TAG"; exit 0
            fi
            if [ "$cloned" = "1" ]; then
              echo "::error::freshly cloned JUCE HEAD carries tags [$(printf '%s' "$tags" | tr '\n' ' ')], expected $JUCE_TAG"; exit 1
            fi
            echo "::warning::cached JUCE HEAD carries tags [$(printf '%s' "$tags" | tr '\n' ' ')], expected $JUCE_TAG; discarding cache entry and re-cloning"
            rm -rf "$juce"
          done
          echo "::error::JUCE identity check failed: expected $JUCE_TAG"; exit 1

      - name: Cache ixwebsocket source (FetchContent)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/_deps/ixwebsocket-src
          key: ixwebsocket-src-${{ runner.os }}-${{ env.IXWEBSOCKET_SHA }}

      - name: Prefetch ixwebsocket at pinned SHA (skipped on cache hit)
        shell: bash
        run: |
          set -euo pipefail
          src="${{ github.workspace }}/_deps/ixwebsocket-src"
          head="$(git -C "$src" rev-parse HEAD 2>/dev/null || true)"
          if [ "$head" != "$IXWEBSOCKET_SHA" ]; then
            [ -z "$head" ] || echo "::warning::cached ixwebsocket-src is at $head, expected $IXWEBSOCKET_SHA; re-fetching"
            rm -rf "$src"
            git clone "$IXWEBSOCKET_URL" "$src"
            git -C "$src" -c advice.detachedHead=false checkout "$IXWEBSOCKET_SHA"
          else
            echo "ixwebsocket $IXWEBSOCKET_SHA restored from cache"
          fi
          [ "$(git -C "$src" rev-parse HEAD)" = "$IXWEBSOCKET_SHA" ] || { echo "::error::ixwebsocket-src HEAD != $IXWEBSOCKET_SHA"; exit 1; }

      # Ninja:macOS 镜像通常自带;缺失时按需装,避免镜像轮换把发版弄红
      - name: Ensure Ninja
        shell: bash
        run: |
          set -euo pipefail
          command -v ninja >/dev/null 2>&1 || brew install ninja
          ninja --version

      # OSX 相关参数(架构/部署目标/FORMATS)全在 CMakeLists,命令行不重复 —— 单一真源;
      # FETCHCONTENT_SOURCE_DIR_IXWEBSOCKET 只是把预取好的源码交给 FetchContent,pin 仍在 CMakeLists.txt
      - name: Configure CMake (Ninja)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUCE_PATH="${{ github.workspace }}/JUCE" \
            -DFETCHCONTENT_SOURCE_DIR_IXWEBSOCKET="${{ github.workspace }}/_deps/ixwebsocket-src"

      # clang 零警告门 —— 与 windows 的 /W4 门同构的黑名单,与 ci.yml 的 mac job 逐字相同:
      # 只排除第三方(_deps / JUCE / vcpkg),其余一律算;排除模式写 (^|/) 同时覆盖 Ninja 的
      # 相对路径 `_deps/...` 与绝对路径;只认编译器诊断行,不把 `ld: warning:` 计进门禁。
      - name: Build (fail on any first-party clang warning)
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --parallel 2>&1 | tee build.log
          warns=$(grep -E ':[0-9]+:[0-9]+: warning:' build.log | grep -vE '(^|/)(_deps|JUCE|vcpkg)/' || true)
          if [ -n "$warns" ]; then
            printf '%s\n' "$warns" | while IFS= read -r line; do echo "::error::$line"; done
            echo "::error::first-party clang warnings: $(printf '%s\n' "$warns" | wc -l | tr -d ' '); zero-warning gate"
            exit 1
          fi

      # 发版链路最需要事后取证:构建失败时把 build.log 留成可下载产物(与 ci.yml / windows job 同待遇)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: SynchainBridge-macos-release-build-log-${{ github.sha }}
          path: build.log
          retention-days: 7
          if-no-files-found: ignore

      # 数量断言与 scripts/package-macos.sh 的 require_single_bundle 同口径;
      # 定位用 `-print -quit`:`find | head -n 1` 在 pipefail 下会因 SIGPIPE(141)杀掉步骤。
      - name: Locate artefacts & assert arm64-only
        shell: bash
        run: |
          set -euo pipefail
          for spec in 'vst3:.vst3' 'component:.component'; do
            ext="${spec%%:*}"; label="${spec##*:}"
            n=$(find build -type d -name "*.$ext" | wc -l | tr -d '[:space:]')
            if [ "$n" != "1" ]; then
              echo "::error::expected exactly 1 $label bundle under build, found $n"; exit 1
            fi
          done
          vst3=$(find build -type d -name '*.vst3' -print -quit)
          au=$(find build -type d -name '*.component' -print -quit)
          # 路径含空格('Synchain Bridge.vst3');GITHUB_ENV 一律用带随机分隔符的 heredoc 形式
          {
            echo "VST3_PATH<<GHENV_${GITHUB_RUN_ID}"
            echo "$vst3"
            echo "GHENV_${GITHUB_RUN_ID}"
            echo "AU_PATH<<GHENV_${GITHUB_RUN_ID}"
            echo "$au"
            echo "GHENV_${GITHUB_RUN_ID}"
          } >> "$GITHUB_ENV"
          archs=$(file "$vst3"/Contents/MacOS/* "$au"/Contents/MacOS/*)
          printf '%s\n' "$archs"
          printf '%s\n' "$archs" | grep -q 'arm64' || { echo "::error::mach-o is not arm64"; exit 1; }
          if printf '%s\n' "$archs" | grep -q 'x86_64'; then
            echo "::error::x86_64 slice present; v1 ships arm64-only"; exit 1
          fi

      # 上游 zip 的可执行位不保证保留,chmod +x 是必需步骤而非保险
      - name: Download pluginval
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_TAG/pluginval_macOS.zip"
          unzip -q pluginval.zip -d pluginval
          chmod +x pluginval/pluginval.app/Contents/MacOS/pluginval

      - name: Validate VST3 (pluginval)
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::pluginval $(basename "$VST3_PATH")"
          rc=0
          ./pluginval/pluginval.app/Contents/MacOS/pluginval \
            --strictness-level 5 --timeout-ms 60000 --skip-gui-tests \
            --output-dir "$RUNNER_TEMP/pluginval-logs" --validate "$VST3_PATH" || rc=$?
          echo "::endgroup::"   # 失败也闭合分组(与 ci.yml 同参)
          [ "${rc:-0}" -eq 0 ] || exit "${rc}"
          echo "Non-GUI strictness-5 passed; full GUI validation is a LOCAL gate."

      # AU 只能用 auval 验:必须 ditto(cp -r 会丢符号链接与扩展属性,bundle 会散架),
      # 装完踢一次 AudioComponentRegistrar 强制重扫。与 ci.yml 的 mac job 逐字相同:
      # 四字码从 CMakeLists.txt 现读(单一真源),set +e 只作用在 auval 那一条 ——
      # 否则 ditto 失败会被误诊成「插件没通过校验」。
      - name: Validate AU (auval)
        shell: bash
        run: |
          set -euo pipefail
          code=$(awk '$1 == "PLUGIN_CODE" { print $2; exit }' CMakeLists.txt)
          mfr=$(awk '$1 == "PLUGIN_MANUFACTURER_CODE" { print $2; exit }' CMakeLists.txt)
          au_main=$(awk '$1 == "AU_MAIN_TYPE" { print $2; exit }' CMakeLists.txt)
          if [ -z "$code" ] || [ -z "$mfr" ]; then
            echo "::error::cannot parse PLUGIN_CODE / PLUGIN_MANUFACTURER_CODE from CMakeLists.txt"; exit 1
          fi
          case "$au_main" in
            kAudioUnitType_Effect)        au_type=aufx ;;
            kAudioUnitType_MusicEffect)   au_type=aumf ;;
            kAudioUnitType_MusicDevice)   au_type=aumu ;;
            kAudioUnitType_MIDIProcessor) au_type=aumi ;;
            *) echo "::error::cannot map AU_MAIN_TYPE '$au_main' from CMakeLists.txt to an auval type"; exit 1 ;;
          esac
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          ditto "$AU_PATH" "$HOME/Library/Audio/Plug-Ins/Components/$(basename "$AU_PATH")"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          # 注册器被 -9 后由 launchd 按需重启并重新扫描 Components/,扫描完成前 auval 会报
          # 「找不到组件」。轮询到 auval -a 能列出本组件为止,最多 30s —— 否则是偶发红灯,
          # 而 publish 双平台强依赖,一次抖动 = 整个 tag 无产物(采纳 #21 review)。
          # 先落变量再 here-string 匹配:grep -q 直连管道会因命中即退给 auval -a 送 SIGPIPE,
          # pipefail 下管道判非零导致 break 永不触发;并按 type/code/mfr 锚定行首防子串误判,
          # 超时显式报错(与 ci.yml 同参,采纳 #20 第三轮 review)。
          registered=0
          for _ in $(seq 1 30); do
            au_list="$(auval -a 2>/dev/null || true)"
            if grep -qE "^[[:space:]]*$au_type[[:space:]]+$code[[:space:]]+$mfr([[:space:]]|$)" <<< "$au_list"; then
              registered=1; break
            fi
            sleep 1
          done
          if [ "$registered" != "1" ]; then
            # 只警告不失败:真正判定在下游 AU VALIDATION SUCCEEDED;正则猜错排版时退化为
            # 「直接验」而不是让整个 tag 无产物(采纳 #21 review,与 ci.yml 同参)。
            echo "::warning::component $au_type/$code/$mfr not seen in auval -a within polling window; proceeding to auval -v anyway"
            echo "::group::auval -a head (diagnostics)"
            auval -a 2>/dev/null | head -40 || true
            echo "::endgroup::"
          fi
          echo "::group::auval -v $au_type $code $mfr"
          auval -v "$au_type" "$code" "$mfr" 2>&1 | tee auval.log || true
          echo "::endgroup::"
          if ! grep -q 'AU VALIDATION SUCCEEDED' auval.log; then
            echo "::error::auval did not report 'AU VALIDATION SUCCEEDED'"
            exit 1
          fi
          echo "auval OK"

      # ---- 打包:唯一真源 = scripts/package-macos.sh;绝不在 YAML 内联 ditto/zip ----
      # 版本号经 step env 间接读入(tag 允许 '$'、反引号、'"',直插 bash 双引号串会真做命令替换);
      # 空值直接 fail —— 否则脚本会静默回落到 CMake 版本,冒烟 tag v0.0.0-test 会产出
      # 名为 v1.5.0 的 zip,publish 的 sha256 复验照样过,错误一路带到 draft Release。
      - name: Package
        shell: bash
        env:
          PKG_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          [ -n "$PKG_VERSION" ] || { echo "::error::gate did not export version"; exit 1; }
          bash scripts/package-macos.sh --version "$PKG_VERSION" --build-dir build --out-dir dist

      - name: Publish job summary
        shell: bash
        run: |
          set -euo pipefail
          cat dist/package-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dist (macos-arm64)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-macos-arm64
          path: |
            dist/SynchainBridge-VST3-AU-*-macos-arm64.zip
            dist/SynchainBridge-VST3-AU-*-macos-arm64.zip.sha256
            dist/package-summary.md
          if-no-files-found: error
          retention-days: 7

      # 失败日志先归拢到工作区同一目录再上传:同时给 $RUNNER_TEMP/... 与工作区路径时,
      # upload-artifact 会以两者的最近公共祖先(/Users/runner/work)展开成别扭结构。
      - name: Collect validation logs (on failure)
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p validation-logs
          cp -R "$RUNNER_TEMP/pluginval-logs" validation-logs/ 2>/dev/null || true
          cp auval.log validation-logs/ 2>/dev/null || true
          ls -lR validation-logs || true

      - name: Upload pluginval / auval logs (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SynchainBridge-macos-validation-logs-${{ github.sha }}
          path: validation-logs
          retention-days: 7
          if-no-files-found: ignore

  # ============================================================================
  # publish —— 全仓唯一持 contents: write 的 job:复验哈希后一次性建 draft Release
  # ============================================================================
  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [gate, release, release-macos]   # gate 在列才能读 needs.gate.outputs.version(needs outputs 不传递)
    timeout-minutes: 10
    permissions:
      contents: write                   # 唯一需要写 Release 的地方,权限只放这一个 job
    steps:
      # 不带 name 下载全部 artifact:每个 artifact 落到 artifacts/<name>/ 下,
      # 两个平台各自的 package-summary.md 因此不会互相覆盖。
      - name: Download platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Flatten & verify checksums
        shell: bash
        env:
          GATE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp artifacts/dist-win64/*.zip artifacts/dist-win64/*.zip.sha256 dist/
          cp artifacts/dist-macos-arm64/*.zip artifacts/dist-macos-arm64/*.zip.sha256 dist/
          # package.ps1 落盘的 .sha256 行尾是 CRLF,而 sha256sum -c 会把结尾的 \r 当成文件名的一部分,
          # 校验必失败。统一成 LF 后再验 —— 用户在 mac/Linux 上手动 sha256sum -c 也才不会踩同一个坑。
          for f in dist/*.sha256; do
            tr -d '\r' < "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done
          cd dist
          # 跨 job 复验:构建 job 算出的哈希与 publish 实际下载到的字节必须对得上,
          # 否则说明 artifact 上传/下载路径上出了问题,绝不能挂到 Release 上。
          sha256sum -c ./*.sha256
          # 资产名必须带本次 tag 的版本号:sha256 只证明字节一致,不证明版本对得上(采纳 #21 review)
          for f in *.zip; do
            case "$f" in *"v${GATE_VERSION}"*) ;; *) echo "::error::asset '$f' does not carry version v${GATE_VERSION}"; exit 1 ;; esac
          done
          ls -l

      # tag 名同样经 step env 间接读入:直插 bash 双引号串时 v1.4.0$(...) 形态的 tag 会真做命令替换
      - name: Publish job summary
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "## Release assets — $REF_NAME"
            echo
            echo '```'
            cat dist/*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 两个平台的产物一次性建成同一个 draft Release;generate_release_notes 全流程只在这里跑一次。
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Synchain Bridge ${{ github.ref_name }} (Windows x64 · macOS arm64)
          draft: true
          generate_release_notes: true
          files: |
            dist/SynchainBridge-VST3-*-win64.zip
            dist/SynchainBridge-VST3-*-win64.zip.sha256
            dist/SynchainBridge-VST3-AU-*-macos-arm64.zip
            dist/SynchainBridge-VST3-AU-*-macos-arm64.zip.sha256
