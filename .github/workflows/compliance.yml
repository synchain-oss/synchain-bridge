name: Compliance
# 三仓逐字取本节;仓库间唯一差异 = 无。它不读任何 secret,也不 checkout 子模块。
on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev, 'feature/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read          # 只读,fork PR 亦然;绝不 pull_request_target(J20)

jobs:
  compliance:
    name: compliance                  # required check context,永不改名,永不加 if:
    runs-on: ubuntu-latest            # V-4 确认前一律 latest(§3.0 口径注)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0              # 全历史:供下方 history scan 扫全部 commit(仓库很小,代价可忽略)
      - name: Read pinned gitleaks version
        id: ver
        run: |
          v=$(tr -d '[:space:]' < .gitleaks-version)
          echo "v=${v#v}" >> "$GITHUB_OUTPUT"
      - name: Install gitleaks (pinned)
        # 版本钉在 .gitleaks-version,与 .juce-version / .pluginval-version 同模式;
        # 不用 marketplace action(它会把版本漂移权交给第三方,且部分版本要 secrets)。
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${{ steps.ver.outputs.v }}/gitleaks_${{ steps.ver.outputs.v }}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Secret scan
        # 与 §5.1 gate 3b 逐字同参,否则「本地绿 / CI 红」会成为常态
        run: gitleaks detect --no-git --source . --redact -v --config .gitleaks.toml
      - name: Secret scan (git history)
        # 树扫描只看当前文件;这一步扫全部 commit 内容,保证敏感信息(密钥 + 自定义的
        # 非密钥类:本机路径/团队域名/非组织邮箱,见 .gitleaks.toml)不借任何历史 commit 入库。
        # 公开仓的历史一旦被 fork/缓存即不可撤回,故此门禁必须常绿。
        run: gitleaks detect --source . --redact -v --config .gitleaks.toml
      - name: Origin allowlist selftest
        # 51 条纯逻辑断言(tests/origin_allowlist_selftest.cpp):CSWSH 白名单通配匹配的已知
        # 绕过形态逐条反例。src/OriginAllowlist.h 零第三方依赖(纯 C++17),ubuntu 上秒级编译。
        # 与本地 gate 5b 同源同用例 —— 安全关键纯逻辑的断言不能只靠人记得在本地跑。
        run: |
          g++ -std=c++17 -I src -o /tmp/origin_allowlist_selftest tests/origin_allowlist_selftest.cpp
          /tmp/origin_allowlist_selftest
      - name: REUSE lint
        # 与 §5.1 gate 3c 逐字同参
        run: pipx run reuse lint
      - name: ixwebsocket cross-platform pin consistency
        # 与本地 gate 3g 同参。两平台的 ixwebsocket 版本机器强制一致:Windows 侧真源 = vcpkg.json 的 override
        # (version-semver + 显式 port-version),macOS 侧真源 = CMakeLists.txt 的 IXWEBSOCKET_TAG(40 位 SHA,
        # 机器不可能反推出版本号),故断言那一行的注释必须标注 `(= tag v<override 版本>)` —— 升级时忘了动
        # 任何一侧,这里就红。IXWEBSOCKET_TAG 的 set 行要求恰好一处,多于一处说明真源有歧义。
        run: |
          set -euo pipefail
          ver=$(jq -r '[.overrides[] | select(.name == "ixwebsocket")][0]["version-semver"] // empty' vcpkg.json)
          [ -n "$ver" ] || { echo "::error::vcpkg.json has no ixwebsocket override with version-semver"; exit 1; }
          jq -e '[.overrides[] | select(.name == "ixwebsocket")][0] | has("port-version")' vcpkg.json >/dev/null \
            || { echo "::error::vcpkg.json ixwebsocket override must state port-version explicitly"; exit 1; }
          n=$(grep -cE '^[[:space:]]*set\(IXWEBSOCKET_TAG[[:space:]]+"[0-9a-f]{40}"' CMakeLists.txt || true)
          [ "$n" = "1" ] || { echo "::error::expected exactly 1 set(IXWEBSOCKET_TAG \"<40-hex>\" ...) line in CMakeLists.txt, found $n"; exit 1; }
          grep -E '^[[:space:]]*set\(IXWEBSOCKET_TAG[[:space:]]+"[0-9a-f]{40}"' CMakeLists.txt | grep -qF "(= tag v$ver)" \
            || { echo "::error::CMakeLists.txt IXWEBSOCKET_TAG line is not annotated '(= tag v$ver)' while vcpkg.json pins $ver"; exit 1; }
          echo "ixwebsocket pin OK: vcpkg.json override $ver <-> CMakeLists.txt IXWEBSOCKET_TAG (= tag v$ver)"
      - name: Font name-table RFN check
        # 与本地 gate 3b2 同参。上面两步的 gitleaks 只看文本:woff2 是 brotli 压缩的,
        # grep 不命中不等于保留字体名已从 name 表清除(OFL-1.1 §3 管的是「呈现给用户的
        # 主字体名」)。brotli 是 fontTools 解 woff2 的必需依赖,不能省。
        run: |
          pip install --quiet fonttools brotli
          python scripts/check-font-names.py
