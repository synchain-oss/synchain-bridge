name: Compliance
# 三仓逐字取本节;仓库间唯一差异 = 无。它不读任何 secret,也不 checkout 子模块。
on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev, 'feature/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read          # 只读,fork PR 亦然;绝不 pull_request_target(J20)

jobs:
  compliance:
    name: compliance                  # required check context,永不改名,永不加 if:
    runs-on: ubuntu-latest            # V-4 确认前一律 latest(§3.0 口径注)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0              # 全历史:供下方 history scan 扫全部 commit(仓库很小,代价可忽略)
      - name: Read pinned gitleaks version
        id: ver
        run: |
          v=$(tr -d '[:space:]' < .gitleaks-version)
          echo "v=${v#v}" >> "$GITHUB_OUTPUT"
      - name: Install gitleaks (pinned)
        # 版本钉在 .gitleaks-version,与 .juce-version / .pluginval-version 同模式;
        # 不用 marketplace action(它会把版本漂移权交给第三方,且部分版本要 secrets)。
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${{ steps.ver.outputs.v }}/gitleaks_${{ steps.ver.outputs.v }}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Secret scan
        # 与 §5.1 gate 3b 逐字同参,否则「本地绿 / CI 红」会成为常态
        run: gitleaks detect --no-git --source . --redact -v --config .gitleaks.toml
      - name: Secret scan (git history)
        # 树扫描只看当前文件;这一步扫全部 commit 内容,保证敏感信息(密钥 + 自定义的
        # 非密钥类:本机路径/团队域名/非组织邮箱,见 .gitleaks.toml)不借任何历史 commit 入库。
        # 公开仓的历史一旦被 fork/缓存即不可撤回,故此门禁必须常绿。
        run: gitleaks detect --source . --redact -v --config .gitleaks.toml
      - name: Origin allowlist selftest
        # 51 条纯逻辑断言(tests/origin_allowlist_selftest.cpp):CSWSH 白名单通配匹配的已知
        # 绕过形态逐条反例。src/OriginAllowlist.h 零第三方依赖(纯 C++17),ubuntu 上秒级编译。
        # 与本地 gate 5b 同源同用例 —— 安全关键纯逻辑的断言不能只靠人记得在本地跑。
        run: |
          g++ -std=c++17 -I src -o /tmp/origin_allowlist_selftest tests/origin_allowlist_selftest.cpp
          /tmp/origin_allowlist_selftest
      - name: PCM frame selftest
        # PCM 帧头 12 字节布局(BRIDGE_CONTRACT.md §二 第 1 条)的 golden 字节断言
        # (tests/pcm_frame_selftest.cpp):字段顺序 / 小端 / 偏移 / 总长逐字节钉死,改任一项即红。
        # src/PcmFrame.h 是同步遗留路径与后台发送线程路径共用的 C++ 侧唯一编码实现,零第三方依赖
        # (纯 C++17)。与本地 gate 5b 同源同用例,编译参数与上一步逐字同构。
        run: |
          g++ -std=c++17 -I src -o /tmp/pcm_frame_selftest tests/pcm_frame_selftest.cpp
          /tmp/pcm_frame_selftest
      - name: PCM frame selftest (web-preview mock, node:test)
        # JS 侧同布局实现 web-preview/pcm-frame.mjs 由 web-preview/pcm-frame.test.mjs 用与上一步
        # **同一组 golden 字节**钉死(node:test + node:assert,零依赖,不 npm install:测试只 import
        # pcm-frame.mjs,它只用 Node 内建 Buffer;mock-server.mjs 依赖的 ws 不在本步骤加载)。
        # 文件路径显式给出而不是传目录:目录参数在 node 20 与 ≥21 的 --test 下语义不同(路径 vs glob),
        # runner 镜像的 node 版本轮换时不应影响本步骤。ubuntu 镜像自带 node ≥ 20,与 web-preview/README
        # 的「Node ≥ 18」要求兼容。
        run: node --test web-preview/pcm-frame.test.mjs
      - name: PCM frame wiring (VstBridgeServer.cpp must encode via PcmFrame.h)
        # 与本地 gate 3f 同构:上面的 golden selftest 钉不住「VstBridgeServer.cpp 真的经 PcmFrame.h 组帧」
        # (那要链 JUCE 才测得到),故用文本断言 —— 必须 #include "PcmFrame.h",且不得再出现抽取前两份
        # 手写实现的特征(`writeU32(` lambda 与字面量 `headerSize = 12`,87133fe 删掉的就是它们)。
        run: |
          f=src/VstBridgeServer.cpp
          grep -qE '^[[:space:]]*#include[[:space:]]+"PcmFrame\.h"' "$f" \
            || { echo "::error::$f must #include \"PcmFrame.h\" (PCM header layout is defined once, in src/PcmFrame.h)"; exit 1; }
          if grep -nE 'writeU32\(|headerSize[[:space:]]*=[[:space:]]*12\b' "$f"; then
            echo "::error::$f still carries a hand-written PCM header (writeU32( lambda / headerSize = 12); encode via src/PcmFrame.h writeHeader/kHeaderSize"
            exit 1
          fi
          # 正向断言(黑名单只认「上次是怎么错的」,拦不住第三种手写法):两条组帧路径都必须经 pcm::writeHeader,
          # 调用点 >= 2。覆盖边界:本门只盯 src/VstBridgeServer.cpp;将来别的 .cpp 里出现第四条组帧路径不在射程内。
          n=$(grep -cE 'pcm::writeHeader\(' "$f" || true)
          [ "$n" -ge 2 ] || { echo "::error::$f must encode both PCM paths via pcm::writeHeader() (found $n call sites, expected >= 2)"; exit 1; }
          echo "PCM frame wiring ok: $f encodes via PcmFrame.h ($n writeHeader call sites)"
      - name: REUSE lint
        # 与 §5.1 gate 3c 逐字同参
        run: pipx run reuse lint
      - name: Font name-table RFN check
        # 与本地 gate 3b2 同参。上面两步的 gitleaks 只看文本:woff2 是 brotli 压缩的,
        # grep 不命中不等于保留字体名已从 name 表清除(OFL-1.1 §3 管的是「呈现给用户的
        # 主字体名」)。brotli 是 fontTools 解 woff2 的必需依赖,不能省。
        run: |
          pip install --quiet fonttools brotli
          python scripts/check-font-names.py
