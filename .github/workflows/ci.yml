name: Build & Validate

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev, 'feature/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: build-and-validate
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      WEBVIEW2_NUGET_VERSION: '1.0.2957.106'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 0) 版本单一真源:JUCE / pluginval 版本只存在于仓库根 .juce-version / .pluginval-version(12 §6.3)。
      #    同时算出 artifact 名用的 ref slug —— feature/extraction 含 '/',upload-artifact@v4 拒绝含 '/' 的名(06 §6.3)。
      - name: Resolve pinned versions & ref slug
        shell: pwsh
        run: |
          $juce = (Get-Content .juce-version -Raw).Trim()
          $pv   = (Get-Content .pluginval-version -Raw).Trim()
          if (-not $juce -or -not $pv) { Write-Error "empty .juce-version / .pluginval-version"; exit 1 }
          "JUCE_TAG=$juce"      | Out-File $env:GITHUB_ENV -Append
          "PLUGINVAL_TAG=$pv"   | Out-File $env:GITHUB_ENV -Append
          $slug = "${{ github.ref_name }}" -replace '[/\\]','-'
          "REF_SLUG=$slug"      | Out-File $env:GITHUB_ENV -Append

      # 1) JUCE:浅克隆锁 tag(不用 FetchContent,避免上游漂移让 CI 突然红)。
      #    先查 actions/cache:key 含 runner.os + .juce-version 内容哈希,tag 一改自动换 key;命中即跳过 clone。
      #    缓存只是加速 —— clone 步骤按「目录里没有 CMakeLists.txt 就 clone」判定而不是只看 cache-hit,
      #    这样 miss、以及命中了一份残缺的缓存(tar 半途出错)都照常走 clone,不会绿着带一个空 JUCE 往下跑。
      #    无论来自缓存还是刚 clone,最后都做身份断言:HEAD 上的 tag(`git tag --points-at HEAD`)必须含 JUCE_TAG
      #    (两边都剥掉可能的 v 前缀再比)。缓存条目对不上(key 撞了 / 被污染)就删掉重 clone,重 clone 后
      #    仍对不上才红 —— 与 mac job 对 ixwebsocket 源码缓存的 HEAD == pin 断言同一纪律。
      - name: Cache JUCE
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/JUCE
          key: juce-${{ runner.os }}-${{ hashFiles('.juce-version') }}

      - name: Clone JUCE (shallow, pinned; skipped on cache hit) & assert tag identity
        shell: pwsh
        run: |
          $juce = "${{ github.workspace }}/JUCE"
          $want = $env:JUCE_TAG -replace '^v', ''
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            $cloned = $false
            if (Test-Path (Join-Path $juce 'CMakeLists.txt')) {
              Write-Host "JUCE $env:JUCE_TAG restored from cache (attempt $attempt)"
            } else {
              if (Test-Path $juce) { Remove-Item $juce -Recurse -Force }
              git clone --depth 1 --branch $env:JUCE_TAG https://github.com/juce-framework/JUCE.git $juce
              if ($LASTEXITCODE -ne 0) { Write-Error "git clone JUCE $env:JUCE_TAG failed"; exit 1 }
              $cloned = $true
            }
            # `git tag --points-at HEAD` 列出 HEAD 上的全部 tag 再找 JUCE_TAG,而不是 `describe --exact-match`:后者一个 commit
            # 挂多个 tag 时只回其中一个,会把正确的缓存误判成污染。不接 `| Select-Object -First 1` 在 git 后面:它会提前掐断
            # 管道,git 的退出码来不及写进 $LASTEXITCODE(实测为空),断言会随机翻车。
            # try/catch:缓存目录在但 .git 缺失/损坏时 git 退出 128,pwsh 7.4+ 默认 $PSNativeCommandUseErrorActionPreference
            # 会把原生命令非零退出抛成终止性错误,下一行的 $LASTEXITCODE 判断轮不到执行 —— 包住才能走到「删掉重 clone」。
            try { $tags = @(git -C $juce tag --points-at HEAD 2>$null) } catch { $tags = @() }
            if ($LASTEXITCODE -ne 0) { $tags = @() }
            $tags = @($tags | ForEach-Object { ([string]$_).Trim() } | Where-Object { $_ })
            $got = ($tags | Where-Object { ($_ -replace '^v', '') -eq $want } | Select-Object -First 1)
            if ($got) { Write-Host "JUCE identity OK: HEAD is tag '$got' == .juce-version $env:JUCE_TAG"; exit 0 }
            if ($cloned) { Write-Error "freshly cloned JUCE HEAD carries tags [$($tags -join ', ')], expected $env:JUCE_TAG"; exit 1 }
            Write-Host "::warning::cached JUCE HEAD carries tags [$($tags -join ', ')], expected $env:JUCE_TAG; discarding the restored directory and re-cloning (the remote cache entry itself cannot be evicted by this workflow: actions/cache never re-saves an existing primary key, so a bad entry keeps being restored and re-cloned until .juce-version changes)"
            Remove-Item $juce -Recurse -Force
          }
          Write-Error "JUCE identity check failed: expected $env:JUCE_TAG"; exit 1

      # 2) vcpkg 静态 triplet;Bridge 真的用 WebSocket → 保留 ixwebsocket(08 §5.3 / 06 §4.1 ④)。
      #    manifest 模式(issue #23):版本由仓库根 vcpkg.json 的 builtin-baseline(40 位 commit)+ overrides 钉死,
      #    不再随 runner 镜像自带的 vcpkg 漂移。这里**不**显式 `vcpkg install`:依赖由下面 Configure 步骤的
      #    vcpkg toolchain 在 configure 期按 vcpkg.json 自动装进 build/vcpkg_installed —— 与本地 scripts/gates.ps1
      #    走的是同一条路径(单一真源);显式 install 会在仓库根另落一份 vcpkg_installed,toolchain 随后还要再装一遍。
      #    VCPKG_DEFAULT_BINARY_CACHE 指到 runner.temp 下的固定目录并交给 actions/cache:vcpkg 的二进制缓存按
      #    包 ABI 哈希寻址(编译器/triplet/port 任一变化都换哈希),比缓存 installed 树稳。
      #    key = runner.os + 镜像身份(ImageOS-ImageVersion)+ triplet + vcpkg.json 哈希:actions/cache 对已存在的
      #    exact key **不会重新保存**,若 key 里没有镜像身份,runner 镜像月度轮换升一次 MSVC 就让 ABI 哈希全变、
      #    每次都重编,而新 archives 永远存不进去(primary key 已被旧镜像的条目占住)—— 缓存会退化成「永不命中」
      #    直到 vcpkg.json 下次改动。镜像身份在 Setup 步骤从 runner 进程环境变量读出后经 GITHUB_ENV 交给表达式
      #    (托管 runner 自带 ImageOS / ImageVersion;缺失时回落成 'unknown-image',只影响 key 粒度不影响正确性)。
      #    restore-keys 只回落一级(同镜像、不同 vcpkg.json):跨镜像的条目 ABI 哈希必然全变、只能全量重编,
      #    回落过去除了把新条目撑大(旧 archives 原样带回再存一遍)什么也换不到,故不设跨镜像回落。
      #    triplet 只由 Configure 的 -DVCPKG_TARGET_TRIPLET 决定,这里不设 VCPKG_DEFAULT_TRIPLET(manifest 模式下
      #    toolchain 不读它,写了只是死配置)。
      - name: Setup vcpkg (manifest mode + binary cache dir)
        shell: pwsh
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          $bc = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Force -Path $bc | Out-Null
          echo "VCPKG_DEFAULT_BINARY_CACHE=$bc" >> $env:GITHUB_ENV
          $img = if ($env:ImageOS -and $env:ImageVersion) { "$env:ImageOS-$env:ImageVersion" } else { 'unknown-image' }
          Write-Host "runner image for vcpkg cache key: $img"
          echo "VCPKG_CACHE_IMAGE=$img" >> $env:GITHUB_ENV
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" --version

      - name: Cache vcpkg binary cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-bincache-${{ runner.os }}-${{ env.VCPKG_CACHE_IMAGE }}-x64-windows-static-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-bincache-${{ runner.os }}-${{ env.VCPKG_CACHE_IMAGE }}-x64-windows-static-

      # 3) WebView2 Evergreen Runtime(windows-2022 是无桌面 Server,自带 Runtime 不保证)
      - name: Ensure WebView2 Runtime (Evergreen)
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\MicrosoftEdgeWebView2Setup.exe"
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $exe
          Start-Process -FilePath $exe -ArgumentList "/silent","/install" -Wait
          echo "WEBVIEW2_USER_DATA_FOLDER=$env:RUNNER_TEMP\wv2ud" >> $env:GITHUB_ENV

      # 4) 缓存 WebView2 NuGet 包(CMake 配置期拉到 build/packages)
      - name: Cache WebView2 NuGet package
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/packages
          key: webview2-nuget-${{ env.WEBVIEW2_NUGET_VERSION }}

      # 5) Configure(vcpkg toolchain 在这一步按 vcpkg.json 自动安装 ixwebsocket → build/vcpkg_installed)。
      #    -DBRIDGE_BUILD_SELFTESTS=ON:两个纯逻辑 selftest(tests/*.cpp)与插件一起编译,让下一步的 /W4 零警告门
      #    真覆盖它们(此前该选项只在本地 gates.ps1 打开;采纳 #27 review)。release.yml 不开:发版构建不需要。
      - name: Configure CMake
        shell: pwsh
        run: |
          if (Test-Path build) { Get-ChildItem build -Exclude packages | Remove-Item -Recurse -Force }
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DJUCE_PATH="${{ github.workspace }}/JUCE" -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DBRIDGE_BUILD_SELFTESTS=ON
          if ($LASTEXITCODE -ne 0) { Write-Error "cmake configure failed"; exit 1 }
          # 供应链留痕:configure 装进来的 ixwebsocket 必须正是 vcpkg.json overrides 钉的版本(version-semver 与
          # port-version 都比,并要求 `Status: install ok installed`),传递依赖 mbedtls / zlib 必须是
          # THIRD-PARTY-NOTICES.md 登记的版本 —— 断言逻辑在 scripts/assert-vcpkg-installed.ps1,与 release.yml 及
          # 本地 scripts/gates.ps1(gate 4b)共用同一份,本地 / CI 同口径;对不上即红并打印实际值。
          ./scripts/assert-vcpkg-installed.ps1 -BuildDir build
          if ($LASTEXITCODE -ne 0) { Write-Error "vcpkg_installed does not match the pinned versions (see ::error:: lines above)"; exit 1 }

      # 5b) Build + 零 warning 断言(/W4 门在 CI 侧的机器强制,06 §4.1 ⑧)。
      #     排除项含 vcpkg_installed:manifest 模式下第三方头落在 build/vcpkg_installed/...,路径里不再有 `\vcpkg\`。
      - name: Build (fail on any MSVC warning)
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { Write-Error "build failed"; exit 1 }
          $w = Select-String -Path build.log -Pattern '\swarning\s+C\d{4}' | Where-Object { $_.Line -notmatch '[\\/](JUCE|vcpkg|vcpkg_installed|_deps)[\\/]' }
          if ($w.Count -gt 0) {
            $w | ForEach-Object { Write-Host "::error::$($_.Line)" }
            Write-Error "MSVC warnings: $($w.Count); /W4 requires zero warnings"; exit 1
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: SynchainBridge-build-log-${{ github.sha }}
          path: build.log
          retention-days: 7

      # 5c) 跑两个 selftest(与 scripts/gates.ps1 的 gate 5b / compliance / mac job 的 Run selftests 同源同用例)。
      #     VS 多配置生成器把 .exe 放在 build/Release/,用 Get-ChildItem -Recurse 定位并断言「恰好 1 个」:
      #     找不到即红(静默跳过等于把断言从门禁删掉),多于 1 个说明构建目录不干净。
      - name: Run selftests (origin allowlist + PCM frame)
        shell: pwsh
        run: |
          foreach ($t in 'origin_allowlist_selftest', 'pcm_frame_selftest') {
            $exes = @(Get-ChildItem -Path build -Recurse -File -Filter "$t.exe" | Where-Object { $_.FullName -notmatch '[\\/]_deps[\\/]' })
            if ($exes.Count -ne 1) { Write-Error "expected exactly 1 $t.exe under build (configure must pass -DBRIDGE_BUILD_SELFTESTS=ON), found $($exes.Count)"; exit 1 }
            Write-Host "::group::$t"
            & $exes[0].FullName 2>&1 | Out-Host
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($code -ne 0) { Write-Error "$t failed (exit $code); cases in tests/$t.cpp"; exit 1 }
          }

      # 6) pluginval strictness 5 --skip-gui-tests(无头 runner 上 WebView2 editor 会崩)
      - name: Download pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/Tracktion/pluginval/releases/download/$env:PLUGINVAL_TAG/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval

      - name: Validate VST3
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path build -Recurse -Filter "*.vst3" -Directory | Select-Object -First 1
          if (-not $vst3) { Write-Error "No VST3 bundle found under build"; exit 1 }
          Write-Host "::group::pluginval $($vst3.Name)"
          & ./pluginval/pluginval.exe --strictness-level 5 --timeout-ms 60000 --skip-gui-tests --output-dir "$env:RUNNER_TEMP/pluginval-logs" "$($vst3.FullName)" 2>&1 | Out-Host
          $code = $LASTEXITCODE
          Write-Host "::endgroup::"
          if ($code -ne 0) { Write-Error "pluginval failed for $($vst3.Name) (exit $code)"; exit 1 }
          Write-Host "Non-GUI strictness-5 passed; full GUI validation is a LOCAL gate."

      # 6b) 发行打包脚本冒烟(与 mac job 的 Package smoke 同构,采纳 #24 review):scripts/package.ps1 只挂在
      #     release.yml 的 tag 触发上;publish 是 needs 两个平台,Windows 打包一回归 = 整个 tag 零资产。
      #     产物丢弃,断言只看形态:zip + .sha256 都产出、summary 五个字段行齐整。
      #     三次运行(ci → ci2 → ci)与 mac 侧同构(issue #23 把 package.ps1 的 summary 从整文件覆盖改成
      #     追加 + 按段去重后搬过来):先再写一条**不同名**的记录,再重跑第一条 —— 它必须只删掉自己那条,
      #     0.0.0-ci2 的段落要原样留着。只跑两次同名会让 buggy 实现(子串命中就删光)与正确实现输出逐字节
      #     相同,断言分辨不出。
      - name: Package smoke (scripts/package.ps1, artefacts discarded)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'package-smoke'
          ./scripts/package.ps1 -Version 0.0.0-ci  -BuildDir build -OutDir $out
          ./scripts/package.ps1 -Version 0.0.0-ci2 -BuildDir build -OutDir $out
          ./scripts/package.ps1 -Version 0.0.0-ci  -BuildDir build -OutDir $out
          Get-ChildItem $out | Out-Host
          foreach ($f in 'SynchainBridge-VST3-v0.0.0-ci-win64.zip', 'SynchainBridge-VST3-v0.0.0-ci-win64.zip.sha256', 'package-summary.md') {
            if (-not (Test-Path (Join-Path $out $f))) { Write-Error "package smoke did not produce $f"; exit 1 }
          }
          # .sha256 的内容形态:恰好一行 `<64 位小写 hex><两个空格><zip 基名>`(sha256sum -c 认的正是这个格式,
          # publish 跨 job 复验也靠它),且 hash 与 Get-FileHash 现算的一致 —— 只断言文件存在的话,写错分隔符 /
          # 大写 hex / 带路径前缀都要到打 tag 那一刻才会在 publish 炸出来(与 mac 侧同构,issue #23)。
          foreach ($v in '0.0.0-ci', '0.0.0-ci2') {
            $zip  = "SynchainBridge-VST3-v$v-win64.zip"
            # 读**原始字节**:Get-Content 会剥行尾测不出 CR,ReadAllText 会按 BOM 探测吃掉 preamble 测不出 BOM。
            # 与 mac 侧 `cat` + 逐字等式同强度:断言字节串恰为 `<hash>  <zip>\n`(LF、无 CR、无 BOM、无多余空行,
            # 用 \z 而不是 $ —— .NET 的 $ 在末尾 \n 之前也匹配,会放过结尾双换行),package.ps1 回退到 Set-Content 就在这里红。
            $bytes = [System.IO.File]::ReadAllBytes((Join-Path $out "$zip.sha256"))
            $raw = [System.Text.Encoding]::ASCII.GetString($bytes)
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              Write-Error "$zip.sha256 starts with a UTF-8 BOM"; exit 1
            }
            if ($raw -cnotmatch "^[0-9a-f]{64}  $([regex]::Escape($zip))`n\z") {
              Write-Error "$zip.sha256 is not exactly '<64 hex>  $zip' + one LF (no CR / no trailing blank line): $([BitConverter]::ToString($bytes))"; exit 1
            }
            $line = @($raw.TrimEnd("`n"))
            $want = (Get-FileHash -LiteralPath (Join-Path $out $zip) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($line[0] -cne "$want  $zip") { Write-Error "$zip.sha256 says '$($line[0])' but the zip hashes to $want"; exit 1 }
          }
          $summary = Get-Content (Join-Path $out 'package-summary.md') -Raw
          foreach ($k in 'version', 'zipFileName', 'sizeBytes', 'sha256', 'releaseDate') {
            # `${k}:` 而不是 `$k:`——pwsh 会把 `$k:` 解析成作用域限定符,直接 ParserError。
            # -cnotmatch 大小写敏感:pwsh 默认不敏感,`Version:` / `SHA256:` 这类漂移会静默走通。
            if ($summary -cnotmatch "(?m)^${k}:") { Write-Error "package-summary.md is missing the '${k}:' line"; exit 1 }
          }
          # 段落断言逐行精确比对(-ceq,大小写敏感),不用子串包含:0.0.0-ci 的行不能被 0.0.0-ci2 的行撞过。
          $lines = @(Get-Content (Join-Path $out 'package-summary.md'))
          $n = @($lines | Where-Object { $_ -cmatch '^zipFileName:' }).Count
          if ($n -ne 2) { Write-Error "package-summary.md should hold exactly 2 segments (ci + ci2), got $n"; exit 1 }
          if (@($lines | Where-Object { $_ -ceq 'zipFileName: SynchainBridge-VST3-v0.0.0-ci2-win64.zip' }).Count -ne 1) {
            Write-Error "re-running 0.0.0-ci wiped the unrelated 0.0.0-ci2 segment (over-deletion regression)"; exit 1
          }
          if (@($lines | Where-Object { $_ -ceq 'zipFileName: SynchainBridge-VST3-v0.0.0-ci-win64.zip' }).Count -ne 1) {
            Write-Error "0.0.0-ci segment should appear exactly once after re-run"; exit 1
          }

      # 7) artifact(命名/保留策略见 06 §6.3;一律用 REF_SLUG,不用 github.ref_name)
      - name: Upload VST3 (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SynchainBridge-VST3-win64-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: build/**/*.vst3
          if-no-files-found: error
          retention-days: 14

      - name: Upload VST3 (dev snapshot)
        if: github.event_name == 'push' && github.ref_name == 'dev'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SynchainBridge-VST3-win64-dev-${{ github.sha }}
          path: build/**/*.vst3
          if-no-files-found: error
          retention-days: 30

      - name: Upload VST3 (preview / feature mainline)
        if: github.event_name == 'push' && github.ref_name != 'dev'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SynchainBridge-VST3-win64-preview-${{ env.REF_SLUG }}-${{ github.sha }}
          path: build/**/*.vst3
          if-no-files-found: error
          retention-days: 30

      - name: Upload pluginval logs (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SynchainBridge-pluginval-logs-${{ github.sha }}
          path: ${{ runner.temp }}/pluginval-logs
          retention-days: 7
          if-no-files-found: ignore

  # ============================================================================
  # macOS(Apple Silicon)—— VST3 + AU,arm64-only,不签名不公证(U13)
  #
  # ⚠️ 成本:本 job 没有额外 if: 闸门,触发面完全继承本 workflow(pull_request→dev 的每次
  #    synchronize + push→dev/'feature/**')。GitHub 托管 macOS runner 按 **10 倍分钟数**
  #    计费,与 CLAUDE.md §4「runner 就低不就高」存在张力。全触发面常开是一项待用户拍板的
  #    成本决策 —— 若要收敛,最小改动是给本 job 加
  #      if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'macos')
  #    在用户明确批准前不擅自加闸门(收窄会让 mac 侧回归漏到 dev)。
  # ============================================================================
  build-and-validate-macos:
    name: build-and-validate-macos
    runs-on: macos-15                   # arm64 原生;macos-14 已进弃用窗口
    permissions:
      contents: read                    # 本 job 只读源码;上传 artifact 不需要 contents 写权限
    timeout-minutes: 60                 # 与 windows job 对称:两边都要编译两个 format wrapper,mac 侧还多一次
                                        # ixwebsocket 的编译;JUCE / ixwebsocket 源码有 actions/cache,但 miss 也得够用
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 0) 版本单一真源:与 windows job 同一份 .juce-version / .pluginval-version(12 §6.3),
      #    只是把 pwsh 换成 bash。REF_SLUG 同样把 '/' 换成 '-'(upload-artifact@v4 拒绝含 '/' 的名)。
      #    ref_name 经 env 间接读入,不直接插值进脚本:分支名允许 '$'、';' 等字符,直接插值即注入面。
      #    MAC_ZIP 也在这里算:定值 zip 名会让不同 PR 的 artifact 解压到同一目录时互相覆盖
      #    且看不出区别,故把 slug 与短 sha 编进内层 zip 名(外层 artifact 名同样带)。
      #    PR 事件下 github.ref_name 是 "<n>/merge"、GITHUB_SHA 是合并提交:与外层 artifact 名用的
      #    head.sha 对不上,排障时会误以为拿错产物(采纳 #24 review)。故两者在 PR 下统一取 head 侧
      #    (分支名 + head sha),push 事件下回落到 ref_name / sha —— 内外层永远同一对值。
      - name: Resolve pinned versions & ref slug
        shell: bash
        env:
          REF_NAME: ${{ github.event.pull_request.head.ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          juce=$(tr -d '[:space:]' < .juce-version)
          pv=$(tr -d '[:space:]' < .pluginval-version)
          if [ -z "$juce" ] || [ -z "$pv" ]; then
            echo "::error::empty .juce-version / .pluginval-version"; exit 1
          fi
          slug="$(printf '%s' "$REF_NAME" | tr '/\\' '--')"
          echo "JUCE_TAG=$juce"      >> "$GITHUB_ENV"
          echo "PLUGINVAL_TAG=$pv"   >> "$GITHUB_ENV"
          echo "REF_SLUG=$slug"      >> "$GITHUB_ENV"
          echo "MAC_ZIP=SynchainBridge-macos-arm64-${slug}-${HEAD_SHA:0:7}.zip" >> "$GITHUB_ENV"
          # ixwebsocket 的 pin 与仓库 URL 同样从单一真源 CMakeLists.txt 现读(供下面的源码缓存 key 与预取用):
          # 解析不到就直接红,而不是让缓存步骤静默用一个空 key。GIT_REPOSITORY 绑定到 ixwebsocket 的
          # FetchContent_Declare 段内取(先命中段头再取第一行 GIT_REPOSITORY),将来 CMakeLists 里再出现别的
          # FetchContent_Declare 也不会把别人的 URL 当成 ixwebsocket 的来 clone。
          ix_sha=$(sed -nE 's/^[[:space:]]*set\(IXWEBSOCKET_TAG[[:space:]]+"([0-9a-f]{40})".*/\1/p' CMakeLists.txt | head -n 1)
          ix_url=$(awk '/FetchContent_Declare\(ixwebsocket/ { f = 1 } f && $1 == "GIT_REPOSITORY" { print $2; exit }' CMakeLists.txt)
          if [ -z "$ix_sha" ] || [ -z "$ix_url" ]; then
            echo "::error::cannot parse IXWEBSOCKET_TAG (40-hex) / GIT_REPOSITORY from CMakeLists.txt"; exit 1
          fi
          echo "IXWEBSOCKET_SHA=$ix_sha" >> "$GITHUB_ENV"
          echo "IXWEBSOCKET_URL=$ix_url" >> "$GITHUB_ENV"

      # 1) 工具链留痕:runner 镜像每月轮换,Xcode/SDK/CMake 一动构建行为就可能变,
      #    出问题时这段日志是判断「代码回归 or 镜像漂移」的第一手材料。
      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          cmake --version
          clang --version
          xcodebuild -version

      # 2) JUCE:浅克隆锁 tag(与 windows job 同策略,不用 FetchContent 避免上游漂移)。
      #    与 windows job 同一套缓存:key = runner.os + .juce-version 哈希;clone 按「没有 CMakeLists.txt」判定,
      #    miss 与残缺命中都照常 clone —— 缓存只是加速,永远不是正确性的前提。
      #    身份断言与 windows job 同口径:HEAD 上的 tag(`git tag --points-at HEAD`)剥 v 前缀后必须含 JUCE_TAG;
      #    缓存条目对不上就删掉重 clone,重 clone 后仍对不上才红(bash 版,逻辑逐条对应 pwsh 版)。
      - name: Cache JUCE
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/JUCE
          key: juce-${{ runner.os }}-${{ hashFiles('.juce-version') }}

      - name: Clone JUCE (shallow, pinned; skipped on cache hit) & assert tag identity
        shell: bash
        run: |
          set -euo pipefail
          juce="${{ github.workspace }}/JUCE"
          want="${JUCE_TAG#v}"
          for attempt in 1 2; do
            cloned=0
            if [ -f "$juce/CMakeLists.txt" ]; then
              echo "JUCE $JUCE_TAG restored from cache (attempt $attempt)"
            else
              rm -rf "$juce"
              git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git "$juce"
              cloned=1
            fi
            # `git tag --points-at HEAD` 列出 HEAD 上的全部 tag 再找 JUCE_TAG(与 pwsh 版同口径;`describe --exact-match`
            # 在一个 commit 挂多个 tag 时只回其中一个,会把正确的缓存误判成污染)
            tags="$(git -C "$juce" tag --points-at HEAD 2>/dev/null || true)"
            got=""
            while IFS= read -r t; do
              if [ -n "$t" ] && [ "${t#v}" = "$want" ]; then got="$t"; break; fi
            done <<< "$tags"
            if [ -n "$got" ]; then
              echo "JUCE identity OK: HEAD is tag '$got' == .juce-version $JUCE_TAG"; exit 0
            fi
            if [ "$cloned" = "1" ]; then
              echo "::error::freshly cloned JUCE HEAD carries tags [$(printf '%s' "$tags" | tr '\n' ' ')], expected $JUCE_TAG"; exit 1
            fi
            echo "::warning::cached JUCE HEAD carries tags [$(printf '%s' "$tags" | tr '\n' ' ')], expected $JUCE_TAG; discarding the restored directory and re-cloning (the remote cache entry itself cannot be evicted by this workflow: actions/cache never re-saves an existing primary key, so a bad entry keeps being restored and re-cloned until .juce-version changes)"
            rm -rf "$juce"
          done
          echo "::error::JUCE identity check failed: expected $JUCE_TAG"; exit 1

      # 2b) ixwebsocket 源码缓存:FetchContent 每次都要完整 clone 上游(钉的是裸 SHA,不能浅克隆)。
      #     这里把源码树预取到 _deps/ixwebsocket-src 并交给 actions/cache(key 含 runner.os + 从 CMakeLists.txt
      #     读出的 IXWEBSOCKET_TAG,升 pin 自动换 key),再经 FETCHCONTENT_SOURCE_DIR_IXWEBSOCKET 喂给 configure ——
      #     CMake 文档语义:设了该变量就跳过 download/update,直接用这份源码。
      #     只缓存源码,不缓存 _deps/ixwebsocket-build(那是构建产物)。目录名刻意叫 `_deps/`:零警告门的排除正则
      #     `(^|/)(_deps|JUCE|vcpkg)/` 原样覆盖,无需改门。
      #     FetchContent 走 SOURCE_DIR 覆盖时不会再核对 commit,所以这里自己断言 HEAD == pin:命中却对不上
      #     (key 撞了 / 缓存被污染)就重拉,重拉后仍对不上才红 —— 永远不带一份不明来源的源码进产物。
      - name: Cache ixwebsocket source (FetchContent)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/_deps/ixwebsocket-src
          key: ixwebsocket-src-${{ runner.os }}-${{ env.IXWEBSOCKET_SHA }}

      - name: Prefetch ixwebsocket at pinned SHA (skipped on cache hit)
        shell: bash
        run: |
          set -euo pipefail
          src="${{ github.workspace }}/_deps/ixwebsocket-src"
          head="$(git -C "$src" rev-parse HEAD 2>/dev/null || true)"
          if [ "$head" != "$IXWEBSOCKET_SHA" ]; then
            [ -z "$head" ] || echo "::warning::cached ixwebsocket-src is at $head, expected $IXWEBSOCKET_SHA; re-fetching"
            rm -rf "$src"
            git clone "$IXWEBSOCKET_URL" "$src"
            git -C "$src" -c advice.detachedHead=false checkout "$IXWEBSOCKET_SHA"
          else
            echo "ixwebsocket $IXWEBSOCKET_SHA restored from cache"
          fi
          [ "$(git -C "$src" rev-parse HEAD)" = "$IXWEBSOCKET_SHA" ] || { echo "::error::ixwebsocket-src HEAD != $IXWEBSOCKET_SHA"; exit 1; }

      # 3) Ninja:macOS 镜像通常自带;缺失时按需装,避免镜像轮换把 job 弄红
      - name: Ensure Ninja
        shell: bash
        run: |
          set -euo pipefail
          command -v ninja >/dev/null 2>&1 || brew install ninja
          ninja --version

      # 4) Configure:OSX 相关参数(架构/部署目标/FORMATS)全在 CMakeLists,命令行不重复 —— 单一真源。
      #    FETCHCONTENT_SOURCE_DIR_IXWEBSOCKET 只是把 2b 预取好的源码交给 FetchContent,pin 本身仍在 CMakeLists.txt。
      #    -DBRIDGE_BUILD_SELFTESTS=ON 与 windows job 同理:让下一步 clang -Wall -Wextra -Wpedantic 零警告门
      #    真覆盖 tests/*.cpp(采纳 #27 review);release.yml 不开。
      - name: Configure CMake (Ninja)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUCE_PATH="${{ github.workspace }}/JUCE" \
            -DFETCHCONTENT_SOURCE_DIR_IXWEBSOCKET="${{ github.workspace }}/_deps/ixwebsocket-src" \
            -DBRIDGE_BUILD_SELFTESTS=ON

      # 5) Build + clang 零警告门 —— 与 windows 的 /W4 门**同构的黑名单**(06 §4.1 ⑧):
      #    只排除第三方,其余一律算(白名单式的 `grep '/src/'` 会让 cmake/ 生成物、
      #    juce_add_binary_data 产出、以及将来新增的源码目录静默逃过门禁)。
      #    - 只认编译器诊断行 `file:line:col: warning:`,与 windows 侧只匹配 `warning Cxxxx`
      #      (不匹配 LNK4xxx)同口径 —— `ld: warning:` 这类链接器噪音不进门禁。
      #    - 排除项写成 (^|/):Ninja 生成器把 FetchContent 依赖写成相对构建目录的
      #      `_deps/<name>-src/...`(无前导斜杠),只写 `/_deps/` 排不掉。
      - name: Build (fail on any first-party clang warning)
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --parallel 2>&1 | tee build.log
          warns=$(grep -E ':[0-9]+:[0-9]+: warning:' build.log | grep -vE '(^|/)(_deps|JUCE|vcpkg)/' || true)
          if [ -n "$warns" ]; then
            printf '%s\n' "$warns" | while IFS= read -r line; do echo "::error::$line"; done
            echo "::error::first-party clang warnings: $(printf '%s\n' "$warns" | wc -l | tr -d ' '); zero-warning gate"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: SynchainBridge-macos-build-log-${{ github.sha }}
          path: build.log
          retention-days: 7

      # 5b) 跑两个 selftest(与 scripts/gates.ps1 的 gate 5b / compliance / windows job 同源同用例)。
      #     Ninja 单配置生成器把可执行文件放在 build/ 根,但仍用 find 定位,免得生成器 / 输出目录一变就
      #     静默找不到;断言「恰好 1 个」并用 -print -quit 取路径,与下面 bundle 定位同口径(pipefail 下
      #     `find | head` 会因 SIGPIPE 翻车)。失败也闭合 ::group::,后续日志不被吞进折叠区。
      - name: Run selftests (origin allowlist + PCM frame)
        shell: bash
        run: |
          set -euo pipefail
          for t in origin_allowlist_selftest pcm_frame_selftest; do
            n=$(find build -type f -name "$t" -perm -u+x -not -path '*/_deps/*' | wc -l | tr -d '[:space:]')
            if [ "$n" != "1" ]; then
              echo "::error::expected exactly 1 $t executable under build (configure must pass -DBRIDGE_BUILD_SELFTESTS=ON), found $n"; exit 1
            fi
            exe=$(find build -type f -name "$t" -perm -u+x -not -path '*/_deps/*' -print -quit)
            echo "::group::$t"
            rc=0
            "$exe" || rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then echo "::error::$t failed (exit $rc); cases in tests/$t.cpp"; exit "$rc"; fi
          done

      # 6) 定位产物 + 架构断言:必须是 arm64 单架构(U13 决定 v1 不出 universal/x86_64)。
      #    数量断言写死「恰好 1 个」而不是「取第一个」:build 下真冒出第 2 个同类 bundle 说明构建
      #    目录不干净,此时静默取第一个会让 CI 绿着把不确定的产物带下去。定位一律用
      #    `-print -quit`:`find | head -n 1` 在 pipefail 下会
      #    因 SIGPIPE(141)被 set -e 杀掉步骤,只要 build 下出现第 2 个匹配就随机翻车。
      - name: Locate artefacts & assert arm64-only
        shell: bash
        run: |
          set -euo pipefail
          for spec in 'vst3:.vst3' 'component:.component'; do
            ext="${spec%%:*}"; label="${spec##*:}"
            n=$(find build -type d -name "*.$ext" | wc -l | tr -d '[:space:]')
            if [ "$n" != "1" ]; then
              echo "::error::expected exactly 1 $label bundle under build, found $n"; exit 1
            fi
          done
          vst3=$(find build -type d -name '*.vst3' -print -quit)
          au=$(find build -type d -name '*.component' -print -quit)
          # 路径含空格('Synchain Bridge.vst3');用带随机分隔符的 heredoc 形式写 GITHUB_ENV,
          # 免得将来路径里出现换行/等号时被静默截断。
          {
            echo "VST3_PATH<<GHENV_${GITHUB_RUN_ID}"
            echo "$vst3"
            echo "GHENV_${GITHUB_RUN_ID}"
            echo "AU_PATH<<GHENV_${GITHUB_RUN_ID}"
            echo "$au"
            echo "GHENV_${GITHUB_RUN_ID}"
          } >> "$GITHUB_ENV"
          archs=$(file "$vst3"/Contents/MacOS/* "$au"/Contents/MacOS/*)
          printf '%s\n' "$archs"
          printf '%s\n' "$archs" | grep -q 'arm64' || { echo "::error::mach-o is not arm64"; exit 1; }
          if printf '%s\n' "$archs" | grep -q 'x86_64'; then
            echo "::error::x86_64 slice present; v1 ships arm64-only"; exit 1
          fi

      # 7) pluginval strictness 5 --skip-gui-tests(无头 runner 上 WebView 编辑器会崩,与 windows 同口径)。
      #    上游 zip 的可执行位不保证保留,chmod +x 是必需步骤而非保险。
      - name: Download pluginval
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_TAG/pluginval_macOS.zip"
          unzip -q pluginval.zip -d pluginval
          chmod +x pluginval/pluginval.app/Contents/MacOS/pluginval

      - name: Validate VST3 (pluginval)
        shell: bash
        run: |
          set -euo pipefail
          # --validate 显式给出:两种 CLI 语义解释下都成立(是开关则路径仍作位置参数,
          # 取值则吃掉路径),且与 docs/build-macos.md 口径一致(采纳 #20 review)。
          # 本地 Windows 实证:位置参数与 --validate 两种写法均真实跑完全部测试项。
          echo "::group::pluginval $(basename "$VST3_PATH")"
          rc=0
          ./pluginval/pluginval.app/Contents/MacOS/pluginval \
            --strictness-level 5 --timeout-ms 60000 --skip-gui-tests \
            --output-dir "$RUNNER_TEMP/pluginval-logs" --validate "$VST3_PATH" || rc=$?
          echo "::endgroup::"   # 失败也闭合分组,后续日志不被吞进折叠区
          [ "$rc" -eq 0 ] || exit "$rc"
          echo "Non-GUI strictness-5 passed; full GUI validation is a LOCAL gate."

      # 8) AU 只能用 auval 验:必须 ditto(cp -r 会丢符号链接与扩展属性,bundle 会散架),
      #    装完踢一次 AudioComponentRegistrar 强制重扫。
      #    - 四字码不写死:从 CMakeLists.txt 的 PLUGIN_CODE / PLUGIN_MANUFACTURER_CODE /
      #      AU_MAIN_TYPE 现读(与「版本号 / JUCE tag / pluginval 版本单一真源」同纪律)。
      #      改码时 CI 会因解析不到而报确切错误,而不是变成「auval 找不到组件」的语义无关报错。
      #    - auval 的退出码历史上不可靠,一律以输出里的 'AU VALIDATION SUCCEEDED' 为准;
      #      故只给 auval 那一条挂 `|| true`,前面的 mkdir/ditto 仍在 set -e 下 —— 否则
      #      ditto 失败(bundle 半残)会被误诊成「插件没通过校验」,排障方向直接带偏。
      - name: Validate AU (auval)
        shell: bash
        run: |
          set -euo pipefail
          code=$(awk '$1 == "PLUGIN_CODE" { print $2; exit }' CMakeLists.txt)
          mfr=$(awk '$1 == "PLUGIN_MANUFACTURER_CODE" { print $2; exit }' CMakeLists.txt)
          au_main=$(awk '$1 == "AU_MAIN_TYPE" { print $2; exit }' CMakeLists.txt)
          if [ -z "$code" ] || [ -z "$mfr" ]; then
            echo "::error::cannot parse PLUGIN_CODE / PLUGIN_MANUFACTURER_CODE from CMakeLists.txt"; exit 1
          fi
          case "$au_main" in
            kAudioUnitType_Effect)        au_type=aufx ;;
            kAudioUnitType_MusicEffect)   au_type=aumf ;;
            kAudioUnitType_MusicDevice)   au_type=aumu ;;
            kAudioUnitType_MIDIProcessor) au_type=aumi ;;
            *) echo "::error::cannot map AU_MAIN_TYPE '$au_main' from CMakeLists.txt to an auval type"; exit 1 ;;
          esac
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          ditto "$AU_PATH" "$HOME/Library/Audio/Plug-Ins/Components/$(basename "$AU_PATH")"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          # 注册器被 -9 后由 launchd 按需重启并重新扫描 Components/,扫描完成前 auval 会报
          # 「找不到组件」。轮询到 auval -a 能列出本组件为止,最多 30s —— 否则这一步是偶发红灯
          # (采纳 #21 claude-review:发版侧 publish 双平台强依赖,一次抖动 = 整个 tag 无产物)。
          # 先把 auval -a 的输出落进变量再匹配:`auval -a | grep -q` 会因 grep 命中即退出而给
          # auval 送 SIGPIPE(141),pipefail 下整条管道判非零,循环就永远 break 不出去;
          # 且按 type/code/mfr 三元组锚定行首,防其它插件描述里撞子串误判(采纳 #20 review)。
          registered=0
          for _ in $(seq 1 30); do
            au_list="$(auval -a 2>/dev/null || true)"
            if grep -qE "^[[:space:]]*$au_type[[:space:]]+$code[[:space:]]+$mfr([[:space:]]|$)" <<< "$au_list"; then
              registered=1; break
            fi
            sleep 1
          done
          if [ "$registered" != "1" ]; then
            # 只警告不失败:真正的判定在下游 AU VALIDATION SUCCEEDED 断言;此处正则依赖
            # auval -a 的未文档化排版,猜错时应退化为「直接验」而不是硬红(采纳 #21 review)。
            echo "::warning::component $au_type/$code/$mfr not seen in auval -a within polling window; proceeding to auval -v anyway"
            echo "::group::auval -a head (diagnostics)"
            auval -a 2>/dev/null | head -40 || true
            echo "::endgroup::"
          fi
          echo "::group::auval -v $au_type $code $mfr"
          auval -v "$au_type" "$code" "$mfr" 2>&1 | tee auval.log || true
          echo "::endgroup::"
          if ! grep -q 'AU VALIDATION SUCCEEDED' auval.log; then
            echo "::error::auval did not report 'AU VALIDATION SUCCEEDED'"
            exit 1
          fi
          echo "auval OK"

      # 8b) 发行打包脚本冒烟(采纳 #24 review):scripts/package-macos.sh 只挂在 release.yml 的 tag
      #     触发上,不在这里真跑一次,它的六条硬断言与 ditto/awk 细节在任何 PR 上都得不到执行;而
      #     publish 是 needs 两个平台,mac 打包一回归 = 整个 tag 零资产,发现时机是打 tag 那一刻。
      #     build 产物此时就在手边,增量成本近零。产物丢弃,只看退出码;版本号用 0.0.0-ci 一眼可辨,
      #     INSTALL.txt 里的源码 URL 因而指向不存在的 tag —— 这是冒烟件,不是分发件。
      - name: Package smoke (scripts/package-macos.sh, artefacts discarded)
        shell: bash
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/package-smoke"
          # 先跑一次**不传 --version** 的 --dry-run:release.yml 与下面三次真跑全部显式传版本,脚本里从
          # CMakeLists.txt 回落读版本的那条 sed 否则在 CI 上永远不执行 —— 而它恰是 GNU / BSD 语法差异
          # 唯一能咬到的地方,只有 macOS runner 上的 BSD sed 才验得到。--dry-run 分支在版本解析之后,
          # 能真跑 sed。对照值用 grep 另取一份(-m1 两端都通,不经 `| head` 免 SIGPIPE),
          # 断言 DryRun 输出里的 Version 行与之逐字相等,不只看退出码。
          # `|| true`:set -e 下赋值语句的退出码就是命令替换的退出码,grep 无命中会当场终止 step,下一行的 ::error 守卫
          # 成了死代码。对照值同样先剔 `#` 行注释(与 gates.ps1 版本 gate 同口径),否则注释里留一行旧 project() 两边同错同过。
          cmake_ver="$(sed -E 's/#.*$//' CMakeLists.txt | grep -m1 -oE '^[[:space:]]*project[[:space:]]*\([[:space:]]*[^[:space:]]+[[:space:]]+VERSION[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+' || true)"
          cmake_ver="${cmake_ver##*[[:space:]]}"
          [ -n "$cmake_ver" ] || { echo "::error::cannot read project(... VERSION) from CMakeLists.txt"; exit 1; }
          dry="$(bash scripts/package-macos.sh --dry-run --build-dir build --out-dir "$smoke")"
          printf '%s\n' "$dry"
          printf '%s\n' "$dry" | grep -Fqx "[DryRun] Version  : $cmake_ver" \
            || { echo "::error::package-macos.sh --dry-run without --version did not resolve $cmake_ver from CMakeLists.txt (BSD sed fallback regressed?)"; exit 1; }
          bash scripts/package-macos.sh --version 0.0.0-ci  --build-dir build --out-dir "$smoke"
          # 三次运行才覆盖到 package-summary.md 的「去重旧段落」awk 分支(全仓唯一真出过 bug 的打包逻辑,
          # 14626ec 修的是「删过头,把别的版本/平台的段落一起删光」):先再写一条**不同名**的记录,
          # 再重跑第一条 —— 它必须只删掉自己那条,0.0.0-ci2 的段落要原样留着。只跑两次同名会让
          # buggy 实现(整文件当一条记录、子串命中就删光)与正确实现输出逐字节相同,断言分辨不出。
          bash scripts/package-macos.sh --version 0.0.0-ci2 --build-dir build --out-dir "$smoke"
          bash scripts/package-macos.sh --version 0.0.0-ci  --build-dir build --out-dir "$smoke"
          ls -l "$smoke"
          # .sha256 的内容形态:恰好一行 `<64 位小写 hex><两个空格><zip 基名>`(sha256sum -c 认的正是这个格式,
          # publish 跨 job 复验也靠它),且 hash 与 shasum -a 256 现算的一致 —— 只看退出码的话,写错分隔符 /
          # 大写 hex / 带路径前缀都要到打 tag 那一刻才会在 publish 炸出来(与 windows 侧同构,issue #23)。
          for v in 0.0.0-ci 0.0.0-ci2; do
            zip="SynchainBridge-VST3-AU-v$v-macos-arm64.zip"
            [ "$(wc -l < "$smoke/$zip.sha256" | tr -d '[:space:]')" = "1" ] \
              || { echo "::error::$zip.sha256 must be exactly one line"; exit 1; }
            line="$(cat "$smoke/$zip.sha256")"
            printf '%s\n' "$line" | grep -qE '^[0-9a-f]{64}  [^[:space:]]+$' \
              || { echo "::error::$zip.sha256 is not '<64 hex>  <zip>' shaped: '$line'"; exit 1; }
            want="$(shasum -a 256 "$smoke/$zip" | awk '{ print $1 }')"
            [ "$line" = "$want  $zip" ] \
              || { echo "::error::$zip.sha256 says '$line' but expected '$want  $zip'"; exit 1; }
          done
          n=$(grep -c '^zipFileName:' "$smoke/package-summary.md" || true)
          if [ "$n" != "2" ]; then echo "::error::package-summary.md should hold exactly 2 segments (ci + ci2), got $n"; exit 1; fi
          grep -qx 'zipFileName: SynchainBridge-VST3-AU-v0.0.0-ci2-macos-arm64.zip' "$smoke/package-summary.md" \
            || { echo "::error::re-running 0.0.0-ci wiped the unrelated 0.0.0-ci2 segment (over-deletion regression)"; exit 1; }
          [ "$(grep -c '^zipFileName: SynchainBridge-VST3-AU-v0.0.0-ci-macos-arm64.zip$' "$smoke/package-summary.md")" = "1" ] \
            || { echo "::error::0.0.0-ci segment should appear exactly once after re-run"; exit 1; }

      # 9) artifact 传输封装(**不是发行打包**):这里只解决 upload-artifact 不保留 POSIX
      #    权限位的问题 —— 直接传 bundle 目录 = 下载方拿到不可执行的死壳。合规文件 /
      #    sha256 / INSTALL.txt 那套发行打包由发版链路的打包脚本负责,不在本 job 内。
      #    ditto 的 --norsrc --noextattr:插件 bundle 不需要资源叉,而 --sequesterRsrc 的定义
      #    就是把资源叉/扩展属性写进 zip 的 __MACOSX/ 目录 —— 那些条目权限恒为 -rw-r--r--,
      #    会被下面的可执行位断言当成真条目而必然误报(pluginval/auval 已 dlopen 过 bundle,
      #    com.apple.provenance 之类 xattr 一定存在);顺带也不给下载方塞 __MACOSX 垃圾。
      #    断言里仍显式排除 __MACOSX/,免得将来有人把 ditto 参数改回去就静默变成假失败。
      - name: Pack bundles (ditto zip preserves exec bits)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf stage "$MAC_ZIP"
          mkdir -p stage
          ditto "$VST3_PATH" "stage/$(basename "$VST3_PATH")"
          ditto "$AU_PATH"   "stage/$(basename "$AU_PATH")"
          ditto -c -k --norsrc --noextattr stage "$MAC_ZIP"
          unzip -Z1 "$MAC_ZIP"
          # 只挑 Contents/MacOS/ 下的**文件**条目:目录条目本身是 d 开头,拿它比可执行位会误报
          macho=$(unzip -Z "$MAC_ZIP" | grep -v '__MACOSX/' | grep -E '/Contents/MacOS/[^[:space:]]' || true)
          if [ -z "$macho" ]; then echo "::error::zip has no Contents/MacOS/ file entries"; exit 1; fi
          # 首字符放行 `-`(普通文件)与 `l`(符号链接):bundle 里出现指向可执行体的 symlink 时
          # unzip -Z 打的是 `lrwxrwxrwx`,只认 `^-rwx` 会把它当成丢了可执行位而假失败。
          if printf '%s\n' "$macho" | grep -vE '^[-l]rwx'; then
            echo "::error::zip lost the executable bit on Contents/MacOS/*"; exit 1
          fi

      # 10) artifact 三档:条件与保留天数与 windows job 逐一对齐(06 §6.3),名字一律用 REF_SLUG
      - name: Upload macOS bundles (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SynchainBridge-macos-arm64-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ env.MAC_ZIP }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS bundles (dev snapshot)
        if: github.event_name == 'push' && github.ref_name == 'dev'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SynchainBridge-macos-arm64-dev-${{ github.sha }}
          path: ${{ env.MAC_ZIP }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS bundles (preview / feature mainline)
        if: github.event_name == 'push' && github.ref_name != 'dev'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SynchainBridge-macos-arm64-preview-${{ env.REF_SLUG }}-${{ github.sha }}
          path: ${{ env.MAC_ZIP }}
          if-no-files-found: error
          retention-days: 30

      # 失败日志先归拢到工作区同一目录再上传:直接同时给 $RUNNER_TEMP/... 与工作区路径,
      # upload-artifact 会以两者的最近公共祖先(/Users/runner/work)展开,artifact 里变成
      # _temp/pluginval-logs/… 与 bridge/bridge/auval.log 这种别扭结构。
      - name: Collect validation logs (on failure)
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p validation-logs
          cp -R "$RUNNER_TEMP/pluginval-logs" validation-logs/ 2>/dev/null || true
          cp auval.log validation-logs/ 2>/dev/null || true
          ls -lR validation-logs || true

      - name: Upload pluginval / auval logs (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SynchainBridge-macos-validation-logs-${{ github.sha }}
          path: validation-logs
          retention-days: 7
          if-no-files-found: ignore
