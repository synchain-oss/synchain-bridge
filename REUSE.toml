version = 1

# ① 兜底(必须放最前;后匹配者优先)。Bridge 主许可证 SPDX = GPL-3.0-or-later(U2 不附例外)。
#    兜底让 reuse lint 对无头文件(README / CMakeLists.txt / .gitignore / .ps1 / .md 等)可达;
#    能加头的源文件(.cpp/.h/.js/.css/.html)仍逐个加头,由 scripts/check-spdx.ps1 单独把关,两者不互相替代。
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "Copyright (c) 2026 Synchain"
SPDX-License-Identifier = "GPL-3.0-or-later"

# ② 特例块覆盖兜底(后匹配者优先)
[[annotations]]
path = "web/js/juce/**"
SPDX-FileCopyrightText = "Raw Material Software Limited"
SPDX-License-Identifier = "AGPL-3.0-or-later"   # 随 JUCE 许可,不加 Synchain 版权头

[[annotations]]
path = "web/fonts/**"
SPDX-FileCopyrightText = "见 THIRD-PARTY-NOTICES.md 的字体家族版权行"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "package-lock.json"
SPDX-FileCopyrightText = "Copyright (c) 2026 Synchain"
SPDX-License-Identifier = "GPL-3.0-or-later"
